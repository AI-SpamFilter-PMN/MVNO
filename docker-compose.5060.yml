# ==============================================================================
# docker-compose.5060.yml — OPTIONAL override to ALSO publish Kamailio on host 5060.
# ==============================================================================
# Use ONLY when host UDP 5060 is free (run ./scripts/preflight.sh; it must report
# "Host UDP 5060 free"). On the canonical dev host, host-level Asterisk owns
# 0.0.0.0:5060, so this override is default-off / blocked (see
# docs/ENVIRONMENT_MATRIX.md §3 and docs/INTEGRATION_CONTRACT.md §3).
#
# Activate (when host 5060 is free):
#   podman compose -f docker-compose.yml -f docker-compose.5060.yml up -d
# ==============================================================================
services:
  kamailio:
    ports:
      - "5066:5060/udp"
      - "5060:5060/udp"   # extra publish for SipClients that hardcode 5060
