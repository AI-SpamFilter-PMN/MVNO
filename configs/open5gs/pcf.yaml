logger:
  file:
    path: /var/log/open5gs/pcf.log

default:
  no_tls: true

global:
  max:
    ue: 1024

pcf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        no_tls: true
        advertise: pcf
    client:
      nrf:
        - uri: http://nrf:7777
          no_tls: true
      udr:
        - uri: http://udr:7777
          no_tls: true
