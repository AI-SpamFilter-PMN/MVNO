logger:
  file:
    path: /var/log/open5gs/amf.log

global:
  max:
    ue: 1024

amf:
  amf_name: "MVNO-AMF"
  guami:
    - plmn_id:
        mcc: '001'
        mnc: '01'
      amf_id:
        region: 2
        set: 2
  tai:
    - plmn_id:
        mcc: '001'
        mnc: '01'
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: '001'
        mnc: '01'
      s_nssai:
        - sst: 1
          sd: 0x000001
  security:
    integrity_order : [ NIA2, NIA1, NIA0 ]
    ciphering_order : [ NEA0, NEA1, NEA2 ]
  network_name:
    full: MVNO
    short: MVNO
  time:
    t3512:
      value: 540
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: amf
    client:
      nrf:
        - uri: http://nrf:7777
  ngap:
    server:
      - address: 0.0.0.0
        port: 38412
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
