logger:
  file:
    path: /var/log/open5gs/upf.log

global:
  max:
    ue: 1024

# UPF: User Plane Function (3GPP Rel-16 5G SA Core)
# Handles packet routing, GTP-U (GPRS Tunnelling Protocol User Plane) encapsulation, and interception.
upf:
  pfcp: # PFCP: Packet Forwarding Control Protocol (3GPP TS 29.244 interface)
    server: # UPF acts solely as PFCP server waiting for SMF association (prevents dual-initiator state machine collisions)
      - address: 0.0.0.0
  gtpu: # GTP-U: GPRS Tunnelling Protocol User Plane (UDP 2152 user plane tunnel interface)
    server:
      - address: 0.0.0.0
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
