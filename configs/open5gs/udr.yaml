logger:
  file:
    path: /var/log/open5gs/udr.log

global:
  max:
    ue: 1024

udr:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        no_tls: true
        advertise: udr
    client:
      nrf:
        - uri: http://nrf:7777
          no_tls: true
      mongodb:
        - name: mongodb
          uri: mongodb://mongodb/open5gs
