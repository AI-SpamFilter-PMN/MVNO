! ==============================================================================
! MVNO Cellular Core — Osmocom Media Gateway (OsmoMGW) Config
! ==============================================================================
! MGCP endpoint for BSC/MSC media anchoring (voice). For SMS-only 2G flows the
! MGW is optional, but kept for completeness of the 2G BSS stack.
! ==============================================================================
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1

mgcp
  bind ip 0.0.0.0
  rtp port-range 4002 16001
  rtp bind-ip 0.0.0.0
  rtp ip-probing
  rtp ip-dscp 46
  bind port 2427
  number endpoints 512
  force-realloc 1
  rtcp-omit
  rtp-patch ssrc
  rtp-patch timestamp
