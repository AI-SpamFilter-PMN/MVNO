! ==============================================================================
! MVNO Cellular Core — Osmocom BTS-virtual (Virtual 2G Base Station) Config
! ==============================================================================
! Virtual BTS speaking GSMTAP multicast on the virtual Um to osmocom-bb virtphy.
! Abis/IPA towards OsmoBSC. Matches BSC unit-id 6969/0 and ARFCN 871 (DCS1800).
! ==============================================================================
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
 logging level set-all notice
line vty
 no login
!
e1_input
 e1_line 0 driver ipa
 e1_line 0 port 0
 no e1_line 0 keepalive
phy 0
 instance 0
bts 0
 band DCS1800
 ipa unit-id 6969 0
 oml remote-ip 127.0.0.1
 rtp jitter-buffer 100
 paging queue-size 200
 paging lifetime 0
 min-qual-rach 50
 min-qual-norm -5
 trx 0
  power-ramp max-initial 23000 mdBm
  power-ramp step-size 2000 mdB
  power-ramp step-interval 1
  ms-power-control osmo
  phy 0 instance 0
