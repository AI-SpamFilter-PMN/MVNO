! ==============================================================================
! MVNO Cellular Core — Osmocom Signaling Transfer Point (OsmoSTP) Config
! ==============================================================================
! Routes SCCP/M3UA signaling between the 2G BSC and the MSC (Goal 5).
! - BSC registers as an ASP (point code 0.42.1) via dynamic routing keys.
! - MSC registers as an ASP (point code 0.23.1) via dynamic routing keys.
! ==============================================================================
log stderr
 logging filter all 1
 logging color 1
 logging print category 1
 logging timestamp 0
 logging level set-all notice
line vty
 no login
!
cs7 instance 0
 xua rkm routing-key-allocation dynamic-permitted
 listen m3ua 2905
  accept-asp-connections dynamic-permitted
