# ==============================================================================
# VictoriaMetrics Scraper Daemon Configuration (vmagent)
# ==============================================================================
# TELEMETRY ARCHITECTURE:
# vmagent is a lightweight scraper daemon from the VictoriaMetrics suite.
# It reads Prometheus-formatted HTTP endpoints across the container network
# and streams time-series metric samples into VictoriaMetrics TSDB (port 8428).
# ==============================================================================

global:
  scrape_interval: 5s     # Scrape metrics every 5 seconds for real-time NOC resolution
  scrape_timeout: 4s      # Cancel HTTP scrape connection if target takes longer than 4 seconds

scrape_configs:
  # RTPEngine Media Relay Prometheus Endpoint
  - job_name: "rtpengine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rtpengine:9900"]
        labels:
          subsystem: "media-plane"
          component: "rtpengine"

  # Spring Boot Interception Gateway Actuator Endpoint
  - job_name: "telecom-api"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["mvno-api:8080"]
        labels:
          subsystem: "control-plane"
          component: "spring-gateway"

  # Scraper Self-Monitoring Endpoint
  - job_name: "vmagent"
    static_configs:
      - targets: ["localhost:8429"]
        labels:
          subsystem: "telemetry"
          component: "vmagent"

  # Open5GS 5G Core Prometheus Metrics (AMF, SMF, UPF)
  - job_name: "open5gs"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["amf:9090", "smf:9090", "upf:9090"]
        labels:
          subsystem: "5g-core"
          component: "open5gs"

  # MongoDB Exporter Prometheus Endpoint
  - job_name: "mongodb"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          subsystem: "database"
          component: "mongodb-exporter"

  # VictoriaMetrics TSDB Self-Scrape Endpoint
  - job_name: "victoria-metrics"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["victoria-metrics:8428"]
        labels:
          subsystem: "telemetry"
          component: "victoria-metrics"
