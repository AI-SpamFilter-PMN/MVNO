[modules]
autoload = yes
noload => chan_sip.so
noload => res_chan_stats.so
noload => app_verbose.so
; The IMAP/ODBC voicemail variants register the SAME VoiceMail/VoiceMailMain
; application names with unconfigured backends and clobber the file-based
; app_voicemail.so registration (observed: "No application 'VoicemailMain'"
; at call time even though the module shows Running). We use plain files.
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
