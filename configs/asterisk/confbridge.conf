[general]

; --- Default conference user profile (no PIN: open rooms) ---
[default_user]
type = user
admin = no
end_marked = yes
denoise = yes
jitterbuffer = yes

; --- User menu: DTMF actions while in the conference ---
[default_menu]
type = menu
*1 = play sound_and_quiet        ; exit conference
1 = toggle_mute
2 = play muted

; --- Default bridge profile ---
[default_bridge]
type = bridge
max_members = 50
record_conference = no
