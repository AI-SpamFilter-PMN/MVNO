; ==============================================================================
; PJSIP — SIP trunk from Kamailio (MVNO edge proxy)
; ==============================================================================
; Kamailio (:5060) does digest auth + interception, then relays INVITEs for
; feature numbers (conference 7XXXX, screening/voicemail 8XXXX) to this
; transport (:5061). Asterisk trusts the Kamailio bridge IP — authentication
; already happened at the edge. UAs never talk to Asterisk directly.
;
; For the call-screening "accept" leg, Asterisk acts as a NORMAL registered UA
; (15550000001) back into Kamailio and Dials the rig callee — so "press 1 to
; accept" really connects to baresip-rx 15559998888.
; ==============================================================================

; --- Transport: Kamailio trunk ---
[transport-udp-5061]
type = transport
protocol = udp
bind = 0.0.0.0:5061

; --- Endpoint: calls relayed by Kamailio (address-trusted trunk) ---
[mvno-trunk]
type = endpoint
context = mvno
disallow = all
allow = ulaw
allow = alaw
allow = g722
allow = opus
direct_media = no          ; force media through Asterisk (required for ConfBridge mixing)
trust_id_inbound = yes
identify_by = ip          ; match by source IP (the Kamailio bridge), no REGISTER needed
send_pai = yes
100rel = no

; --- Identify: only the Kamailio bridge IP may reach the trunk ---
[mvno-trunk-ident]
type = identify
endpoint = mvno-trunk
match = 10.89.0.23

; ==============================================================================
; Outbound registered UA (screening accept-leg): Asterisk REGISTERs to Kamailio
; as 15550000001 (digest testpass, like any softphone) and can Dial the rig
; callee through the edge proxy.
; ==============================================================================

[transport-udp-5060-out]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[screening-out]
type = endpoint
context = mvno
disallow = all
allow = ulaw
allow = alaw
allow = g722
allow = opus
auth = screening-out-auth
outbound_auth = screening-out-auth
aors = screening-out-aor
direct_media = no
from_user = 15550000001
from_domain = 10.89.0.23

[screening-out-auth]
type = auth
auth_type = userpass
username = 15550000001
password = testpass

[screening-out-aor]
type = aor
contact = sip:15550000001@10.89.0.23:5060
max_contacts = 1
