; ==============================================================================
; MVNO Asterisk dialplan (context "mvno" — reachable via the Kamailio trunk)
; ==============================================================================; Feature numbers (dialed from any registered UA through Kamailio):
;   7XXX   -> ConfBridge conference room XXX          (conference calling, e.g. 7001)
;   8XXX   -> voicemail main (mailbox XXX)            (check / recorded messages)
;   8000   -> call-screening demo:
;              caller states their name (recorded),
;              then 1 = accept  -> live Dial to rig callee 15559998888
;                   2 = decline -> polite hangup
;                   3 = message -> leave a recorded message on mailbox 1000
; Accept/decline for ordinary ringing calls is NATIVE SIP (200/486/603) and
; lives in the UAs (Linphone/baresip show Accept/Decline) — no dialplan needed.
; ==============================================================================

[general]
static = yes
writeprotect = yes

[mvno]

; --- Conference rooms: 7XXX, 7[MSISDN], *7X, conference ---
exten => _7.,1,NoOp(MVNO-CONF: room ${EXTEN:1} caller ${CALLERID(num)})
 same => n,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,ConfBridge(${EXTEN:1},default_bridge,default_user,default_menu)
 same => n,Hangup()

exten => _*7.,1,NoOp(MVNO-CONF-SHORT: room ${EXTEN:2} caller ${CALLERID(num)})
 same => n,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,ConfBridge(${EXTEN:2},default_bridge,default_user,default_menu)
 same => n,Hangup()

exten => conference,1,Goto(mvno,7001,1)
exten => conf,1,Goto(mvno,7001,1)
exten => *7,1,Goto(mvno,7001,1)
exten => conf-factory,1,Goto(mvno,7001,1)
exten => conference-factory,1,Goto(mvno,7001,1)
exten => confbridge,1,Goto(mvno,7001,1)

; --- In-Call Real-Time Audio Whisper Warning (ChanSpy) ---
exten => _whisper-.,1,NoOp(MVNO-WHISPER: Ingesting warning to channel ${EXTEN:8})
 same => n,Set(VOLUME(TX)=4)
 same => n,Playback(beep)
 same => n,ChanSpy(PJSIP/${EXTEN:8},qwEB)
 same => n,Hangup()

exten => scam-warn,1,NoOp(MVNO-SCAM-WARN: Warning caller of AI phishing detection)
 same => n,Playback(beep)
 same => n,Playback(vm-intro)
 same => n,Hangup()



; --- Voicemail main: 8XXX (mailbox = XXX, default demo mailbox 1000) ---
exten => _8XXX,1,NoOp(MVNO-VM: mailbox ${EXTEN:1} caller ${CALLERID(num)})
 same => n,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,VoicemailMain(${EXTEN:1}@default)
 same => n,Hangup()

; --- Call screening demo: 8000 ---
exten => 8000,1,NoOp(MVNO-SCREENING: caller ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,Wait(1)
 same => n,Playback(vm-intro)            ; "Welcome to the mailbox of..."
 same => n,Playback(beep)
 ; Record the caller's name (up to 10 s, # to finish).
 same => n,Record(/tmp/screening-name-${UNIQUEID}.wav,0,10,s)
 same => n,Playback(vm-youhave)          ; "You have..."
 same => n,Playback(vm-no)               ; "...no..."
 same => n,Read(CHOICE,vm-options,1)     ; "Press 1 to accept, 2 to decline, 3 to leave a message"
 same => n,GotoIf($["${CHOICE}" = "1"]?accept)
 same => n,GotoIf($["${CHOICE}" = "2"]?decline)
 same => n,GotoIf($["${CHOICE}" = "3"]?message)
 same => n,Hangup()

 same => n(accept),NoOp(MVNO-SCREENING-ACCEPT: connecting caller to rig callee)
 ; Dial the rig callee through Kamailio as the registered UA 15550000001
 ; (the screening accept-leg really rings baresip-rx 15559998888).
 same => n,Dial(PJSIP/15559998888@screening-out,30)
 same => n,Hangup()

 same => n(decline),Playback(vm-goodbye)
 same => n,Hangup()

 same => n(message),NoOp(MVNO-SCREENING-MESSAGE: recording reply for mailbox 1000)
 same => n,Voicemail(1000@default)
 same => n,Hangup()
