! ==============================================================================
! MVNO Cellular Core — Osmocom MSC & SMSC Configuration
! ==============================================================================
! Acronym Legend:
! - MSC   (Mobile Switching Center): Switching node handling mobile voice calls & SMS routing.
! - SMSC  (Short Message Service Center): Store-and-forward gateway delivering cellular SMS messages.
! - SMPP  (Short Message Peer-to-Peer): SMPP v3.4 protocol listening on TCP port 2775.
! - ESME  (External Short Messaging Entity): External client application (telecom-api) binding via SMPP.
! - HLR   (Home Location Register): Subscriber location and authentication database over GSUP port 4222.
! - VTY   (Virtual Terminal Interface): Osmocom Cisco-style CLI management shell.
! ==============================================================================

line vty
 no login
!

hlr
 ! Static IP 10.89.0.45 guaranteed by docker-compose.yml line 374 (ipv4_address: 10.89.0.45).
 ! Osmocom VTY lexer uses inet_pton() internally and requires raw IPv4 address format.
 remote-ip 10.89.0.45
!

smpp
 local-tcp-ip 0.0.0.0 2775
 system-id MVNO_SMSC

 esme mvno-api-route
  password changeme
 !
 esme smsclient
  password password
 !
!
