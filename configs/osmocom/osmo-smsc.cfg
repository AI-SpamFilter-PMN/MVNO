! ==============================================================================
! MVNO Cellular Core — Osmocom MSC & SMSC Configuration
! ==============================================================================
! Acronym Legend:
! - MSC   (Mobile Switching Center): Switching node handling mobile voice calls & SMS routing.
! - SMSC  (Short Message Service Center): Store-and-forward gateway delivering cellular SMS messages.
! - SMPP  (Short Message Peer-to-Peer): SMPP v3.4 protocol listening on TCP port 2775.
! - ESME  (External Short Messaging Entity): External client application (telecom-api) binding via SMPP.
! - HLR   (Home Location Register): Subscriber location and authentication database over GSUP port 4222.
! - VTY   (Virtual Terminal Interface): Osmocom Cisco-style CLI management shell.
! - A-IF  (A-interface): 2G BSC<->MSC SCCP/M3UA signaling via OsmoSTP (Goal 5 2G twin).
! ==============================================================================

line vty
 no login
!

log stderr
 logging filter all 1
 logging color 0
 logging print category 1
 logging print level 1
 logging timestamp 1
 logging level set-all debug
!

cs7 instance 0
 ! 2G A-interface: register with OsmoSTP as an M3UA ASP client (pc 0.23.1).
 network-indicator international
 point-code 0.23.1
 asp asp-clnt-OsmoMSC-A 2905 0 m3ua
  remote-ip 10.89.0.50
  role asp
  sctp-role client
  no shutdown

hlr
 ! Static IP 10.89.0.45 guaranteed by docker-compose.yml line 374 (ipv4_address: 10.89.0.45).
 ! Osmocom VTY lexer uses inet_pton() internally and requires raw IPv4 address format.
 remote-ip 10.89.0.45
!

msc
 ! 2G A-interface bound to cs7 instance 0.
 cs7-instance-a 0
 assign-tmsi

network
 network country code 001
 mobile network code 01
 short name MVNO_MSC
 long name MVNO_MSC
 encryption a5 0
 rrlp mode none
 mm info 1

smsc
 database /var/lib/osmocom/smsc.db

smpp
 local-tcp-ip 0.0.0.0 2775
 system-id MVNO_SMSC

 esme mvno-api-route
  password changeme
 !
 esme smsclient
  password password
 !
!
