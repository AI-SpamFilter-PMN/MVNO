! ==============================================================================
! MVNO Cellular Core — Osmocom Home Location Register (OsmoHLR) Config
! ==============================================================================
! Acronym Legend:
! - HLR   (Home Location Register): Database storing subscriber IMSI, MSISDN, and 2G/3G/4G auth triplets.
! - GSUP  (Generic Subscriber Update Protocol): Osmocom internal signaling protocol listening on TCP port 4222.
! - IMSI  (International Mobile Subscriber Identity): 15-digit unique subscriber SIM identifier.
! - MSISDN (Mobile Station International Subscriber Directory Number): E.164 phone number string.
! - VTY   (Virtual Terminal Interface): Osmocom Cisco-style CLI shell.
! ==============================================================================

line vty
 no login
!

hlr
 database /var/lib/osmocom/hlr.db
 gsup
  bind ip 0.0.0.0
!
