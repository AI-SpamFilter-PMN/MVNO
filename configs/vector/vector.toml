# ==============================================================================
# Vector High-Throughput Log Shipper & VRL Parser Configuration
# ==============================================================================
# LOG PIPELINE ARCHITECTURE:
# Vector collects raw syslog and stdout log streams from Kamailio, OsmoMSC, and
# Spring Boot, applies VRL (Vector Remap Language) regex transforms to parse E.164
# phone numbers and SIP Call-IDs, and ships structured JSON logs to VictoriaLogs/Grafana.
# ==============================================================================

[sources.container_logs]
type = "docker_logs"
# Explicit allow-list: the telephony/signaling containers whose logs feed the
# parse_telecom_events transform. "mvno-vector" MUST be excluded: podman's
# journald log driver captures this container's own stdout, and docker_logs
# with include_containers=["*"] re-ingests it (RFC5424 self-feedback loop).
include_containers = ["mvno-api", "mvno-kamailio", "mvno-ip-sm-gw", "mvno-osmosmsc", "mvno-osmo-msc", "mvno-2g-ms", "mvno-2g-ms2", "baresip-rx", "baresip-tx"]

[transforms.parse_telecom_events]
type = "remap"
inputs = ["container_logs"]
source = '''
# Extract timestamp, container name, and raw message body
# Non-aborting timestamp parse: on failure (podman journald frames often carry
# no parseable .timestamp) coalesce keeps the original value instead of
# dropping the event. NOTE: `if t, err = parse_timestamp(...); err == null {...}`
# is a compile error in VRL 0.44 — the coalesce form below is the supported idiom.
.timestamp = parse_timestamp(.timestamp, format: "%+") ?? .timestamp
.container = .container_name

# VictoriaLogs reads the message from _msg (log display field in VL/Grafana).
._msg = .message

# VRL Regex Parsing: Extract E.164 phone numbers (MSISDN) from raw signaling logs
if contains(to_string!(.message), "INVITE") {
  .event_type = "SIP_INVITE"
  caps, err = parse_regex(to_string!(.message), r'(?i)from: sip:(?P<caller>\d+)@')
  if err == null {
    .caller_msisdn = caps.caller
  }
} else if contains(to_string!(.message), "submit_sm") {
  .event_type = "SMS_SUBMIT"
} else {
  .event_type = "SYSTEM_LOG"
}
'''

[sinks.file_sink]
type = "file"
inputs = ["parse_telecom_events"]
path = "/var/log/vector/telecom_events.json"
encoding.codec = "json"

# ==============================================================================
# LOG SINK — VictoriaLogs (ROADMAP item 3: persistent log ingestion).
# Vector's elasticsearch sink in bulk mode is the documented VictoriaLogs
# integration (VictoriaMetrics docs: "Vector -> VictoriaLogs"):
# POST /insert/elasticsearch/_bulk on victorialogs:9428.
# ==============================================================================
[sinks.victorialogs]
type = "elasticsearch"
inputs = ["parse_telecom_events"]
endpoints = ["http://victorialogs:9428/insert/elasticsearch/"]
mode = "bulk"
api_version = "v8"
# VL rejects vector's ES-sink healthcheck probe (400) — bulk ingest works;
# row landing is verified via the LogsQL API (see gate/runbook evidence).
healthcheck.enabled = false

# ==============================================================================
# METRICS PIPELINE — scrape IP-SM-GW bridge counters and remote-write to
# VictoriaMetrics TSDB (Goal 8: "New SMS counters" / metrics ingestion).
# Vector-ingested metrics augment vmagent scraping for the same bridge endpoint.
# ==============================================================================
[sources.bridge_metrics]
type = "prometheus_scrape"
endpoints = ["http://ip-sm-gw:9100/metrics"]
scrape_interval_secs = 5

[sinks.vm_remote_write]
type = "prometheus_remote_write"
inputs = ["bridge_metrics"]
endpoint = "http://victoria-metrics:8428/api/v1/write"

