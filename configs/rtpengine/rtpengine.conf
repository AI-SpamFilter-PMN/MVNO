# ==============================================================================
# MVNO Interception Core — RTPEngine Media Relay Config
# ==============================================================================
# Acronym Reference & Architecture Legend:
# - RTP       (Real-time Transport Protocol): Media stream carrying audio payloads.
# - RTPEngine (Media Proxy): B2BUA media relay capturing audio streams to /var/spool/rtpengine.
# - NG        (Next-Gen Control Protocol): Bencode-encoded control protocol listening on UDP 22222.
# - B2BUA     (Back-to-Back User Agent): Media node terminating and re-originating RTP streams.
# - SDP       (Session Description Protocol - RFC 4566): Media capabilities exchange payload.
# - PCAP      (Packet Capture): Binary network traffic capture format.
# ==============================================================================

[rtpengine]
# Primary network interface bound inside container
interface=eth0

# Run in foreground mode (required for container orchestration)
foreground=true
log-stderr=true

# Control NG protocol socket for Kamailio signaling proxy connection
listen-ng=0.0.0.0:22222

# Prometheus HTTP metrics endpoint for VictoriaMetrics scraping
listen-http=0.0.0.0:9900

# UDP port range allocated for relaying RTP audio packets between subscribers
port-min=30000
port-max=30100

# Audio recording directory for voice call tap / interception
# mr9.4 supports ONLY recording-method=pcap|proc and recording-format=raw|eth.
# "fork" (introduced by fdefcbd) is rejected by the binary
# ("Recording method 'fork' not supported") and left spooldir NULL, tripping
# "Call recording requested, but no spool directory configured" on every call.
# WAV recording does not exist on mr9.4 (2dcdfe9's wav switch was moot);
# pcap->wav audio extraction for Vosk is a roadmap item.
recording-dir=/var/spool/rtpengine
recording-method=pcap
recording-format=eth

# Telecom metadata logging
dtmf-log=yes

media-timeout=1800
max-sessions=1000
log-level=3
