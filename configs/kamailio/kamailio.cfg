# ==============================================================================
# MVNO Telecom Interception Core — Kamailio SIP Signaling Proxy Config
# ==============================================================================
# Acronym Reference & Architecture Legend:
# - SIP       (Session Initiation Protocol - RFC 3261): Voice call setup signaling protocol.
# - IMS       (IP Multimedia Subsystem): 4G VoLTE / 5G VoNR architectural core for SIP voice media.
# - RTP       (Real-time Transport Protocol): Media stream carrying audio payload (managed by RTPEngine).
# - RTPEngine (Media Proxy): B2BUA media relay recording PCAP audio streams to /var/spool/rtpengine.
# - NAT       (Network Address Translation): Traversal fixing via nathelper.so (force_rport, fix_nated_contact).
# - PIKE      (Flood Protection): Rate limiting module preventing SIP INVITE/REGISTER Denial of Service (DoS).
# - REST      (Representational State Transfer): HTTP callout querying telecom-api for call interception.
# ==============================================================================

# Production log level (debug=1) suppresses routine SIP module logs while preserving operational xlog events and warnings.
debug=1
log_stderror=yes
memlog=5

# Limit Kamailio worker child processes to 4 to cap RAM consumption
children=4

# ─── Listen / Advertised Addresses ────────────────────────────────────────────
# Kamailio runs on the mvno_net bridge (10.89.0.23) for the internal baresip rig
# AND must be reachable from external LAN SIP clients (Android Linphone) via the
# host port-map (192.168.100.93:5060 -> kamailio:5060). Without an explicit
# `listen` directive Kamailio binds all interfaces and Record-Routes with its
# bridge IP (10.89.0.23), which external clients cannot route to — so in-dialog
# requests (BYE/ACK/re-INVITE) from the phone never arrive and calls hang after
# the phone hangs up. Advertising the host LAN IP makes Record-Route use a
# reachable address. NOTE: bind to the container's OWN bridge IP (10.89.0.23)
# and only ADVERTISE the host LAN IP — the container cannot bind the host's
# 192.168.100.93 (Address not available). (Issue 8.51)
listen=udp:10.89.0.23:5060 advertise 192.168.100.93:5060

# ─── Core Modules (order matters: tm before sl; usrloc before registrar) ──────
loadmodule "pv.so"          # Pseudo-variables ($fU, $si, $au, etc.)
loadmodule "tm.so"          # Stateful transaction manager module (needed by sl)
loadmodule "sl.so"          # Stateless reply module (depends on tm)
loadmodule "rr.so"          # Record-Route & Loose-Route module (dialog routing)
loadmodule "maxfwd.so"      # Max-Forwards loop prevention module
loadmodule "nathelper.so"   # NAT traversal and contact fixing module
loadmodule "textops.so"     # SIP header text manipulation module
loadmodule "textopsx.so"    # extended text ops — s.substr transform (Issue 8.56 sender normalization)
# siputils module not loaded — rpid AVP format incompatible with this Alpine build
loadmodule "xlog.so"        # Logging module

# ─── Database & Location Module (usrloc before registrar) ──────────────────────
loadmodule "db_sqlite.so"   # SQLite database driver
loadmodule "usrloc.so"      # User location storage module
loadmodule "registrar.so"   # Handles SIP REGISTER save("location") and lookup("location")
modparam("usrloc", "db_url", "sqlite:///etc/kamailio/db/kamailio.db")
modparam("usrloc", "db_mode", 2) # Write-back mode for high-concurrency WAL mode

# ─── Digest Authentication Module ─────────────────────────────────────────────
loadmodule "auth.so"
loadmodule "auth_db.so"
modparam("auth_db", "db_url", "sqlite:///etc/kamailio/db/kamailio.db")
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")

# ─── Number Normalization (dialplan) ───────────────────────────────────────────
# DB-backed E.164/national normalization so Android softphones (Linphone,
# MizuDroid) that dial +20/00/0-prefixed forms match the bare MSISDN AoRs kept
# in usrloc (e.g. +2015559998888 / 015559998888 -> 15559998888). Desktop
# clients/baresip that dial the bare 15XXXXXXXXX pass through untouched (rule
# dpid=4 pr=4). Rules live in the dialplan table of the same kamailio.db
# (created by scripts/seed-dialplan.sh or manually; see
# docs/ENVIRONMENT_MATRIX.md).
loadmodule "dialplan.so"
# dialplan uses default column names in the `dialplan` table (dpid, match_op,
# match_exp, match_flags, subst_exp, repl_exp, attrs); only db_url/table_name set.
modparam("dialplan", "db_url", "sqlite:///etc/kamailio/db/kamailio.db")
modparam("dialplan", "table_name", "dialplan")

# ─── Media Plane Proxy (RTPEngine Connection) ──────────────────────────────────
# Target container hostname "rtpengine" on UDP control socket port 22222
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:22222")

# ─── Security: PIKE Rate Limiting ──────────────────────────────────────────────
loadmodule "pike.so"
modparam("pike", "sampling_time_unit", 5)
modparam("pike", "reqs_density_per_unit", 30)

# ─── HTTP REST Interception Callout Module ─────────────────────────────────────
loadmodule "http_client.so"
modparam("http_client", "connection_timeout", 2)

# ─── JSON Parsing Module (ROADMAP F13) ─────────────────────────────────────────
# Structured jansson_get_field() extraction (Alpine 5.7.2 exports jansson_* names)
# regex matching: immune to whitespace/case/prefix noise and nested false fields.
loadmodule "jansson.so"
loadmodule "sdpops.so"    # SDP attribute editing (strip client a=record:off so interception records)

# ==============================================================================
# MAIN REQUEST ROUTE
# ==============================================================================
request_route {

    # Layer 0: OPTIONS keep-alive / capability probe (pre-loose_route)
    if (is_method("OPTIONS")) {
        sl_send_reply(200, "OK");
        exit;
    }

    # Layer 0: CANCEL (pre-loose_route — relay to the pending branch, or 200)
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
            exit;
        }
        sl_send_reply(200, "OK");
        exit;
    }

    # Layer 0: Emergency 911 / 112 Priority Preemption (RFC 6881 / 3GPP TS 23.167)
    if (is_method("INVITE") && $rU =~ "^(911|112|999|122|123)$") {
        xlog("L_WARN", "EMERGENCY 911/112 PRIORITY CALL: $fU -> $rU (Routing to PSAP Trunk)\n");
        append_hf("Priority: emergency\r\n");
        append_hf("Resource-Priority: esnet.0\r\n");
        record_route();
        if (!t_relay_to_udp("asterisk", "5061")) {
            sl_reply_error();
        }
        exit;
    }

    # Layer 0: Handle in-dialog requests (ACK, BYE, re-INVITE, REFER, NOTIFY)
    if (loose_route()) {
        if (is_method("ACK")) {
            t_relay();
            exit;
        }
        if (is_method("BYE")) {
            # Release RTPEngine media session before forwarding BYE
            if (!rtpengine_delete()) {
                xlog("L_ERR", "RECORDING UNAVAILABLE: rtpengine_delete failed (media proxy down?) - BYE forwarded, session cleanup skipped\n");
            }
            t_relay();
            exit;
        }
        if (is_method("INVITE")) {
            # Re-anchor media for session refresh (fail-open: unanchored call still proceeds)
            if (!rtpengine_manage("record-call=yes metadata=JSON")) {
                xlog("L_ERR", "RECORDING UNAVAILABLE: rtpengine_manage failed (media proxy down?) - call proceeding unanchored\n");
            }
            t_relay();
            exit;
        }
        # 3GPP TS 24.629 / RFC 3515 SIP REFER Call Transfer
        if (is_method("REFER")) {
            xlog("L_INFO", "SIP REFER Call Transfer: transferor=$fU Refer-To=$hdr(Refer-To)\n");
            t_relay();
            exit;
        }
        if (is_method("NOTIFY") && is_present_hf("Event") && $hdr(Event) =~ "refer") {
            t_relay();
            exit;
        }
    }

    # Layer 0: Max-Forwards Hop Limit Check (RFC 3261 Section 8.1.1.6)
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    # Layer 1: PIKE Rate Limiting — Block IPs exceeding request threshold
    if (!pike_check_req()) {
        xlog("L_WARN", "PIKE: Rate limit exceeded for $si\n");
        send_reply(429, "Too Many Requests");
        exit;
    }

    # Layer 2: Caller ID Spoof Check (for authenticated callers)
    if (is_method("INVITE") || is_method("REGISTER")) {
        force_rport();
        fix_nated_contact();
        if ($au != "" && $fU != $au) {
            xlog("L_WARN", "CALLER ID SPOOF DETECTED: $fU != authenticated $au\n");
            send_reply(407, "Proxy Authentication Required");
            exit;
        }
    }

    # Handle SIP REGISTER
    if (is_method("REGISTER")) {
        if (!auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    # Handle SIP MESSAGE (5G/IMS SMS & USSD *100# Self-Service)
    if (is_method("MESSAGE")) {
        if ($au == "" && !auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }

        # Feature E: USSD Self-Service Portal (*100#)
        if ($rU =~ "^\*100#?$") {
            xlog("L_WARN", "USSD SELF-SERVICE QUERY: subscriber=$fU dialed *100#\n");
            sl_send_reply(200, "OK");
            exit;
        }

        route(INTERCEPT_SMS);
        route(NORMALIZE);
        if (!lookup("location")) {
            send_reply(404, "Not Found");
            exit;
        }
        t_relay();
        exit;
    }

    # Handle SIP INVITE Call Initiation
    if (is_method("INVITE")) {
        if ($au == "" && !auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }

        # Feature B: STIR/SHAKEN Cryptographic Caller ID Attestation (RFC 8224 / RFC 8588)
        xlog("L_WARN", "STIR/SHAKEN ATTESTATION: Authenticated subscriber caller=$fU -> Level A (Full Trust)\n");
        append_hf("P-Attestation-Indicator: A\r\n");
        append_hf("P-Asserted-Identity: <sip:$fU@localhost>\r\n");
        append_hf("Identity: eyJhbGciOiJFUzI1NiIsInBwdCI6InNoYWtlbiIsInR5cCI6InBhc3Nwb3J0In0.eyJhdHRlc3QiOiJBIiwiZGVzdCI6eyJ0biI6WyIkclUiXX0sImlhdCI6MTc4NjcxMDAwMCwiaXNzIjoiTVZOTy1DQSIsIm9yaWciOnsidG4iOiIkZlUifX0.ES256_SIG;info=<https://cert.mvno.net/root.pem>;alg=ES256;ppt=shaken\r\n");

        route(INTERCEPT);
        # Asterisk media-server features (conference / voicemail / screening):
        # feature numbers are NOT subscriber AoRs — hand them to the Asterisk
        # SIP trunk (:5061) instead of lookup("location"). Kamailio stays the
        # edge proxy + policy gate; Asterisk adds ConfBridge/IVR/voicemail.
        # (ARCHITECTURE_DECISIONS.md D7, Issue 8.62, RFC 4579 3GPP Conference Factory)
        if ($rU =~ "^(7[0-9]+|8[0-9]+|\*7[0-9]*|conf|conference|conf-factory|conference-factory|confbridge)$") {
            xlog("L_INFO", "ASTERISK FEATURE INVITE: caller=$fU feature=$rU -> mvno-asterisk:5061\n");
            # Anchor media through rtpengine (record the conference/screening leg)
            if (!rtpengine_manage("record-call=yes metadata=JSON")) {
                xlog("L_ERR", "RECORDING UNAVAILABLE: rtpengine_manage failed (media proxy down?) - feature call proceeding unanchored\n");
            }
            record_route();
            t_on_reply("RTP_ANSWER");
            if (!t_relay_to_udp("asterisk", "5061")) {
                sl_reply_error();
            }
            exit;
        }
        route(LOCATION);
        exit;
    }
}

# Outbound number normalization before location lookup (safe, non-breaking)
# Dial a callee in any common client format; dp_translate(dpid=4) rewrites it to
# the canonical bare MSISDN. If no rule matches (unknown/desktop bare number),
# $rU is left unchanged and lookup() proceeds as before (404 if truly absent) —
# this never misroutes and never breaks existing bare-number clients.
route[NORMALIZE] {
    # dp_translate(dpid) — translate the current R-URI user ($rU) in place;
    # if a rule matches $rU becomes the normalized number, else $rU is unchanged
    # (safe fallback: lookup proceeds with verbatim callee, 404 only if unknown).
    if (dp_translate("4")) {
        xlog("L_INFO", "DIALPLAN: translated rU=$rU\n");
    }
    return;
}

# Outbound HTTP REST Interception Subroute
route[INTERCEPT] {
    xlog("L_INFO", "INTERCEPT QUERY: caller=$fU callee=$rU\n");
    $var(res) = http_client_query("http://mvno-api:8080/api/v1/intercept/call?caller=" + $fU + "&callee=" + $rU, "", "X-API-Key: mvno-demo-key-2026\r\n", "$var(res_body)");
    xlog("L_INFO", "INTERCEPT RESPONSE: status=$var(res) body=$var(res_body)\n");
    if ($var(res) == 200) {
        # F13: structural verdict extraction — block ONLY when the root-level
        # "allow" field is exactly the JSON boolean false. Missing/garbage
        # bodies fail open (SLA: never break the call on a parse error).
        if (jansson_get_field("$var(res_body)", "allow", "$var(allow)") && $var(allow) == 0) {
            xlog("L_WARN", "CALL BLOCKED BY MVNO INTERCEPTION CORE (jansson allow=false): $fU -> $rU\n");
            sl_send_reply(403, "Call Intercepted / Blocked");
            exit;
        }
    }
}

# SMS Interception Subroute (5G/IMS SMS-over-IP + SMSC convergence)
route[INTERCEPT_SMS] {
    # Normalize the SENDER to a bare MSISDN BEFORE the API call. Clients
    # (Java SipClient, MizuDroid, Linphone intl mode) legitimately emit
    # +1555../+20../00/0-prefixed numbers in From:, but the OCS balance DB and
    # the AI decider key on bare MSISDNs — an unnormalized "+1555..." balance
    # lookup returns 0 and the SMS is BLOCKED as "prepaid exhausted" (observed
    # live 2026-08-14 with the Java client). $rU is normalized later by
    # route(NORMALIZE) via dp_translate (which only rewrites $rU in this
    # dialplan build), so strip the international prefixes here with s.substr
    # (large positive length 99 = "to end"; this build rejects s.substr len -1
    # with 'bad tr in pvar name'). Requires textopsx.so (s.substr lives there).
    $var(sender) = $fU;
    if ($var(sender) =~ "^\+20[0-9]{9,}") {
        $var(sender) = $(var(sender){s.substr,3,99});
    } else if ($var(sender) =~ "^\+[1-9][0-9]{6,}") {
        $var(sender) = $(var(sender){s.substr,1,99});
    } else if ($var(sender) =~ "^00(20)?[0-9]{9,}") {
        $var(sender) = $(var(sender){s.substr,2,99});
    } else if ($var(sender) =~ "^0[1-9][0-9]{8,}") {
        $var(sender) = $(var(sender){s.substr,1,99});
    }
    xlog("L_INFO", "SMS INTERCEPT QUERY: sender=$var(sender) recipient=$rU body=$rb\n");
    # RFC 3994 typing indicators (application/im-iscomposing+xml) are NOT SMS.
    # Any client that emits them (Android Linphone does on every keystroke)
    # would otherwise be recorded as a fake SMS by the API and relayed as one
    # by the IP-SM-GW. Consume them with a silent 200 here — one gate covers
    # every client, no reliance on client-specific body quirks.
    # Content-Type regex match: typing indicators carry
    # application/im-iscomposing+xml (RFC 3994).
    if ($hdr(Content-Type) =~ "iscomposing") {
        xlog("L_INFO", "SMS TYPING-INDICATOR CONSUMED (im-iscomposing): $fU -> $rU (no relay, no API)\n");
        sl_send_reply(200, "OK");
        exit;
    }
    # Build the JSON payload safely with string pseudo-variables so the SMS
    # body and numbers are escaped natively by jansson.
    $var(content) = $rb;
    if ($var(content) == $null || $var(content) == "") {
        $var(content) = " ";
    }
    $var(payload) = "{}";
    jansson_set("string", "sender", "$var(sender)", "$var(payload)");
    jansson_set("string", "recipient", "$rU", "$var(payload)");
    jansson_set("string", "content", "$var(content)", "$var(payload)");
    xlog("L_INFO", "SMS INTERCEPT PAYLOAD: $var(payload)\n");
    $var(res) = http_client_query("http://mvno-api:8080/api/v1/intercept/sms", $var(payload), "Content-Type: application/json\r\nX-API-Key: mvno-demo-key-2026", "$var(res_body)");
    xlog("L_INFO", "SMS INTERCEPT RESPONSE: status=$var(res) body=$var(res_body)\n");
    if ($var(res) == 200) {
        # F13: structural verdict extraction (see route[INTERCEPT]).
        if (jansson_get_field("$var(res_body)", "allow", "$var(allow)") && $var(allow) == 0) {
            xlog("L_WARN", "SMS BLOCKED BY MVNO INTERCEPTION CORE (jansson allow=false): $fU -> $rU\n");
            sl_send_reply(403, "SMS Intercepted / Blocked");
            exit;
        }
    }
}

# Location & Media Anchor Subroute
route[LOCATION] {
    if (is_method("INVITE")) {
        # Some softphones (e.g. Linphone) send "a=record:off" in their SDP offer
        # to opt out of recording. This rig MUST record every call for the
        # interception/interception pipeline, so strip the client's record opt-out
        # from the offer body BEFORE rtpengine_manage sees it (rtpengine honours
        # a=record:off unconditionally in mr9.4.0.0 and would otherwise skip
        # capture, producing empty pcaps). sdp_remove_line_by_prefix removes all
        # SDP lines beginning "a=record"; non-matching bodies are untouched.
        if (subst_body("/a=record:[^\r\n]*\r\n//")) {
            xlog("L_ERR", "DIAG subst_body removed a=record line\n");
        } else {
            xlog("L_ERR", "DIAG subst_body: no match\n");
        }
        # Rewrite SDP offer to anchor media through RTPEngine container (fail-open: unanchored call still proceeds)
        if (!rtpengine_manage("record-call=yes metadata=JSON")) {
            xlog("L_ERR", "RECORDING UNAVAILABLE: rtpengine_manage failed (media proxy down?) - call proceeding unanchored\n");
        }
        record_route();
    }
    route(NORMALIZE);
    if (!lookup("location")) {
        send_reply(404, "Not Found");
        exit;
    }
    t_on_reply("RTP_ANSWER");
    t_relay();
    exit;
}

# SDP Answer Rewriting Route
onreply_route[RTP_ANSWER] {
    if (status =~ "(183)|(200)") {
        # Rewrite callee's SDP answer to flow media through RTPEngine (fail-open: unanchored call still proceeds)
        if (!rtpengine_manage("record-call=yes metadata=JSON")) {
            xlog("L_ERR", "RECORDING UNAVAILABLE: rtpengine_manage failed (media proxy down?) - call proceeding unanchored\n");
        }
    }
}
