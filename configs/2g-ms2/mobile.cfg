! ==============================================================================
! MVNO Cellular Core — OsmocomBB Mobile #2 (2G Handset) Config
! ==============================================================================
! layer23 'mobile' MS application attached to virtphy via the L1CTL socket.
! IMSI 001010000000005 matches HLR subscriber 5 (15557778888).
! Ki = comp128 all-zero key provisioned in OsmoHLR aud2g.
! ==============================================================================
line vty
 no login
!
ms 1
 layer2-socket /tmp/osmocom_l2
 sap-socket /tmp/osmocom_sap
 stick 871
 sim test
 network-selection-mode auto
 imei 000000000000000 0
 imei-fixed
 no emergency-imsi
 sms-service-center 15550000000
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  p-gsm
  e-gsm
  r-gsm
  gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  min-rxlev -110
  dsc-max 90
  no skip-max-per-band
 test-sim
  imsi 001010000000005
  ki comp128 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
  no barred-access
  rplmn 001 01
!
 no shutdown
