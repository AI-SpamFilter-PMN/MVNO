<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 980" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080b14; }
      .panel-client { fill: #0d1b2e; stroke: #1e6fa8; stroke-width: 1.8; }
      .panel-core   { fill: #051a14; stroke: #00c49a; stroke-width: 1.8; }
      .panel-gw     { fill: #1a0d2e; stroke: #9b59b6; stroke-width: 1.8; }
      .panel-ai     { fill: #1f0a08; stroke: #e74c3c; stroke-width: 1.8; }

      .badge-num { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #080b14; }
      .title-main { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 0.3px; }
      .title-sub  { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #90a4ae; }
      .node-name  { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #eceff1; }
      .node-sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #90a4ae; }
      .lbl        { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .branch-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; }

      .lifeline-client { stroke: #1e6fa8; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-core   { stroke: #00c49a; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-gw     { stroke: #9b59b6; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-ai     { stroke: #e74c3c; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }

      .arrow-smpp  { stroke: #26c6da; stroke-width: 2.2; fill: none; }
      .arrow-ocs   { stroke: #9b59b6; stroke-width: 2; fill: none; }
      .arrow-ai    { stroke: #ef5350; stroke-width: 2.2; fill: none; }
      .arrow-allow { stroke: #66bb6a; stroke-width: 2.5; fill: none; }
      .arrow-block { stroke: #ef5350; stroke-width: 2.5; fill: none; }
      .arrow-resp  { stroke-dasharray: 6,4; }

      .divider { stroke: #1e2740; stroke-width: 1.2; }
      .branch-allow { fill: #051a0d; stroke: #2e7d32; stroke-width: 1.8; }
      .branch-block { fill: #1f0808; stroke: #c62828; stroke-width: 1.8; }
      .branch-label-allow { fill: #060f07; stroke: #2e7d32; stroke-width: 1.8; }
      .branch-label-block { fill: #0f0505; stroke: #c62828; stroke-width: 1.8; }
      .note-box { fill: #0e1627; stroke: #263252; stroke-width: 1.2; rx: 4; }
      .badge-box { fill: #080b14; stroke-width: 1; opacity: 0.94; rx: 4; ry: 4; }
    </style>

    <marker id="h-smpp" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#26c6da"/>
    </marker>
    <marker id="h-smpp-l" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#26c6da"/>
    </marker>
    <marker id="h-ocs" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#9b59b6"/>
    </marker>
    <marker id="h-ai"  viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#ef5350"/>
    </marker>
    <marker id="h-ai-l" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#ef5350"/>
    </marker>
    <marker id="h-allow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#66bb6a"/>
    </marker>
    <marker id="h-allow-l" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#66bb6a"/>
    </marker>
    <marker id="h-block" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#ef5350"/>
    </marker>
    <marker id="h-block-l" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#ef5350"/>
    </marker>

    <linearGradient id="grad-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1140" height="980" fill="url(#grad-bg)"/>
  <line x1="0" y1="130" x2="1140" y2="130" class="divider"/>
  <line x1="0" y1="945" x2="1140" y2="945" class="divider"/>

  <!-- Title -->
  <text x="30" y="36" class="title-main">SMS Store-and-Forward Interception &amp; Bridging Flow</text>
  <text x="30" y="56" class="title-sub">SMPP 3.4 Delivery Hold · Prepaid OCS Balance · AI Spam Classification · Dual-Branch Policy</text>

  <!-- ═══════════ PARTICIPANT BOXES ═══════════ -->
  <!-- ESME / 5G UE -->
  <rect x="20"  y="68" width="145" height="52" rx="7" class="panel-client"/>
  <text x="92"  y="89"  text-anchor="middle" class="node-name">ESME / 5G UE</text>
  <text x="92"  y="106" text-anchor="middle" class="node-sub">Sender · SMPP / SIP</text>
  <line x1="92"  y1="120" x2="92"  y2="920" class="lifeline-client"/>

  <!-- OsmoSMSC & IP-SM-GW -->
  <rect x="205" y="68" width="180" height="52" rx="7" class="panel-core"/>
  <text x="295" y="89"  text-anchor="middle" class="node-name">OsmoSMSC + IP-SM-GW</text>
  <text x="295" y="106" text-anchor="middle" class="node-sub">SMSC + 2G↔5G Bridge</text>
  <line x1="295" y1="120" x2="295" y2="920" class="lifeline-core"/>

  <!-- telecom-api -->
  <rect x="445" y="68" width="170" height="52" rx="7" class="panel-gw"/>
  <text x="530" y="89"  text-anchor="middle" class="node-name">telecom-api</text>
  <text x="530" y="106" text-anchor="middle" class="node-sub">Spring Boot · :8080</text>
  <line x1="530" y1="120" x2="530" y2="920" class="lifeline-gw"/>

  <!-- AI Spam Model -->
  <rect x="685" y="68" width="165" height="52" rx="7" class="panel-ai"/>
  <text x="767" y="89"  text-anchor="middle" class="node-name">AI Spam Model</text>
  <text x="767" y="106" text-anchor="middle" class="node-sub">REST API · :8008/:8000</text>
  <line x1="767" y1="120" x2="767" y2="920" class="lifeline-ai"/>

  <!-- Recipient UE -->
  <rect x="940" y="68" width="160" height="52" rx="7" class="panel-client"/>
  <text x="1020" y="89"  text-anchor="middle" class="node-name">Recipient (2G/5G)</text>
  <text x="1020" y="106" text-anchor="middle" class="node-sub">Target MSISDN</text>
  <line x1="1020" y1="120" x2="1020" y2="920" class="lifeline-client"/>

  <!-- ═══════════ SIGNALING STEPS ═══════════ -->

  <!-- Step 1: submit_sm PDU: ESME → OsmoSMSC -->
  <circle cx="92" cy="165" r="10" fill="#26c6da"/>
  <text x="92" y="169" text-anchor="middle" class="badge-num">1</text>
  <line x1="102" y1="165" x2="285" y2="165" class="arrow-smpp" marker-end="url(#h-smpp)" />
  <rect x="135" y="153" width="115" height="16" class="badge-box" stroke="#26c6da"/>
  <text x="192" y="165" text-anchor="middle" class="lbl" fill="#26c6da">submit_sm PDU</text>

  <!-- Step 2: Delivery Hold + HLR check -->
  <rect x="215" y="190" width="160" height="26" rx="5" class="note-box" stroke="#00c49a"/>
  <text x="295" y="207" text-anchor="middle" class="lbl" fill="#00c49a">2. Hold · OsmoHLR Lookup</text>

  <!-- Step 3: POST /api/v1/intercept/sms: OsmoSMSC → telecom-api -->
  <circle cx="295" cy="242" r="10" fill="#26c6da"/>
  <text x="295" y="246" text-anchor="middle" class="badge-num">3</text>
  <line x1="305" y1="242" x2="520" y2="242" class="arrow-smpp" marker-end="url(#h-smpp)"/>
  <rect x="345" y="230" width="145" height="16" class="badge-box" stroke="#26c6da"/>
  <text x="417" y="242" text-anchor="middle" class="lbl" fill="#26c6da">POST /api/v1/intercept/sms</text>

  <!-- Step 4: Prepaid OCS Balance Check -->
  <rect x="450" y="265" width="160" height="26" rx="5" class="note-box" stroke="#9b59b6"/>
  <text x="530" y="282" text-anchor="middle" class="lbl" fill="#9b59b6">4. Prepaid OCS Balance Check</text>

  <!-- Step 5: POST /classify: telecom-api → AI Spam Model -->
  <circle cx="530" cy="318" r="10" fill="#ef5350"/>
  <text x="530" y="322" text-anchor="middle" class="badge-num">5</text>
  <line x1="540" y1="318" x2="757" y2="318" class="arrow-ai" marker-end="url(#h-ai)"/>
  <rect x="585" y="306" width="130" height="16" class="badge-box" stroke="#ef5350"/>
  <text x="650" y="318" text-anchor="middle" class="lbl" fill="#ef5350">POST /classify (Body)</text>

  <!-- Step 6: HTTP 200 OK { allow: true/false }: AI Spam Model → telecom-api -->
  <circle cx="767" cy="355" r="10" fill="#ef5350"/>
  <text x="767" y="359" text-anchor="middle" class="badge-num">6</text>
  <line x1="757" y1="355" x2="540" y2="355" class="arrow-ai arrow-resp" marker-end="url(#h-ai-l)"/>
  <rect x="580" y="343" width="140" height="16" class="badge-box" stroke="#ef5350"/>
  <text x="650" y="355" text-anchor="middle" class="lbl" fill="#ef5350">HTTP 200 { allow / block }</text>

  <!-- ══════════════════════════════════════════════════════════
       POLICY DECISION BRANCH  (top = ALLOW, bottom = BLOCK)
  ══════════════════════════════════════════════════════════ -->

  <!-- Outer wrapper -->
  <rect x="45" y="390" width="1055" height="520" rx="8" fill="#080d1a" stroke="#1e2740" stroke-width="1.5"/>
  <text x="66" y="412" class="branch-lbl" fill="#90a4ae">POLICY DECISION BRANCH:</text>

  <!-- ── ALLOW box (top) ── -->
  <rect x="58" y="425" width="1029" height="210" rx="6" class="branch-allow"/>
  <rect x="58" y="425" width="1029" height="26"  rx="6" class="branch-label-allow"/>
  <text x="572" y="442" text-anchor="middle" class="branch-lbl" fill="#66bb6a">✓ ALLOW  (allow: true)</text>

  <!-- ── BLOCK box (bottom) ── -->
  <rect x="58" y="650" width="1029" height="240" rx="6" class="branch-block"/>
  <rect x="58" y="650" width="1029" height="26"  rx="6" class="branch-label-block"/>
  <text x="572" y="667" text-anchor="middle" class="branch-lbl" fill="#ef5350">✗ BLOCK  (allow: false)</text>

  <!-- ── Lifeline overlays inside branches ── -->
  <line x1="92"   y1="425" x2="92"   y2="905" class="lifeline-client"/>
  <line x1="295"  y1="425" x2="295"  y2="905" class="lifeline-core"/>
  <line x1="530"  y1="425" x2="530"  y2="905" class="lifeline-gw"/>
  <line x1="767"  y1="425" x2="767"  y2="905" class="lifeline-ai"/>
  <line x1="1020" y1="425" x2="1020" y2="905" class="lifeline-client"/>

  <!-- ─────────── ALLOW path: 7a → 8a → 9a ─────────── -->

  <!-- 7a: telecom-api → OsmoSMSC: HTTP 200 OK { allow: true } -->
  <circle cx="530" cy="485" r="10" fill="#66bb6a"/>
  <text x="530" y="489" text-anchor="middle" class="badge-num" fill="#000">7a</text>
  <line x1="520" y1="485" x2="305" y2="485" class="arrow-allow arrow-resp" marker-end="url(#h-allow-l)"/>
  <rect x="350" y="473" width="145" height="16" class="badge-box" stroke="#66bb6a"/>
  <text x="422" y="485" text-anchor="middle" class="lbl" fill="#66bb6a">HTTP 200 { allow: true }</text>

  <!-- 8a: OsmoSMSC → Recipient UE: deliver_sm -->
  <circle cx="295" cy="540" r="10" fill="#66bb6a"/>
  <text x="295" y="544" text-anchor="middle" class="badge-num" fill="#000">8a</text>
  <line x1="305" y1="540" x2="1010" y2="540" class="arrow-allow" marker-end="url(#h-allow)"/>
  <rect x="530" y="528" width="220" height="16" class="badge-box" stroke="#66bb6a"/>
  <text x="640" y="540" text-anchor="middle" class="lbl" fill="#66bb6a">deliver_sm PDU / SIP MESSAGE</text>

  <!-- 9a: OsmoSMSC → ESME: submit_sm_resp CP-ACK success -->
  <circle cx="295" cy="595" r="10" fill="#66bb6a"/>
  <text x="295" y="599" text-anchor="middle" class="badge-num" fill="#000">9a</text>
  <line x1="285" y1="595" x2="102" y2="595" class="arrow-allow arrow-resp" marker-end="url(#h-allow-l)"/>
  <rect x="135" y="583" width="125" height="16" class="badge-box" stroke="#66bb6a"/>
  <text x="197" y="595" text-anchor="middle" class="lbl" fill="#66bb6a">submit_sm_resp (OK)</text>

  <!-- ─────────── BLOCK path: 7b → 8b → 9b ─────────── -->

  <!-- 7b: telecom-api → OsmoSMSC: { allow: false, reason: "OCS / EIR Block" } -->
  <circle cx="530" cy="710" r="10" fill="#ef5350"/>
  <text x="530" y="714" text-anchor="middle" class="badge-num">7b</text>
  <line x1="520" y1="710" x2="305" y2="710" class="arrow-block arrow-resp" marker-end="url(#h-block-l)"/>
  <rect x="340" y="698" width="165" height="16" class="badge-box" stroke="#ef5350"/>
  <text x="422" y="710" text-anchor="middle" class="lbl" fill="#ef5350">{ allow: false, reason: "Spam" }</text>

  <!-- 8b: SMSC drops SMS — note box -->
  <rect x="310" y="735" width="460" height="52" rx="5" fill="#130505" stroke="#7b1818" stroke-width="1.2"/>
  <text x="540" y="755" text-anchor="middle" class="lbl" fill="#ef5350">8b. SMSC drops SMS · Audit Interception Logged</text>
  <text x="540" y="773" text-anchor="middle" class="lbl" fill="#ef5350">5G path: Kamailio replies 403 Forbidden - SMS Blocked</text>

  <!-- 9b: OsmoSMSC → ESME: submit_sm_resp failure / RP-ERROR -->
  <circle cx="295" cy="820" r="10" fill="#ef5350"/>
  <text x="295" y="824" text-anchor="middle" class="badge-num">9b</text>
  <line x1="285" y1="820" x2="102" y2="820" class="arrow-block arrow-resp" marker-end="url(#h-block-l)"/>
  <rect x="130" y="808" width="135" height="16" class="badge-box" stroke="#ef5350"/>
  <text x="197" y="820" text-anchor="middle" class="lbl" fill="#ef5350">submit_sm_resp (Error)</text>

  <!-- Footer legend -->
  <line x1="30"  y1="960" x2="80"  y2="960" stroke="#26c6da" stroke-width="2.2"/>
  <text x="88"  y="964" class="lbl" fill="#78909c" font-size="11">SMPP Signaling</text>
  <line x1="200" y1="960" x2="250" y2="960" stroke="#9b59b6" stroke-width="2"/>
  <text x="258" y="964" class="lbl" fill="#78909c" font-size="11">OCS Check</text>
  <line x1="340" y1="960" x2="390" y2="960" stroke="#ef5350" stroke-width="2.2"/>
  <text x="398" y="964" class="lbl" fill="#78909c" font-size="11">AI Classify</text>
  <line x1="480" y1="960" x2="530" y2="960" stroke="#66bb6a" stroke-width="2.5"/>
  <text x="538" y="964" class="lbl" fill="#78909c" font-size="11">Allowed Path</text>
  <line x1="630" y1="960" x2="680" y2="960" stroke="#ef5350" stroke-width="2.5"/>
  <text x="688" y="964" class="lbl" fill="#78909c" font-size="11">Blocked Path</text>
</svg>