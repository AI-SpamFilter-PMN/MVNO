<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 840" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080b14; }
      .panel-client { fill: #0d1b2e; stroke: #1e6fa8; stroke-width: 1.8; }
      .panel-core   { fill: #051a14; stroke: #00c49a; stroke-width: 1.8; }
      .panel-gw     { fill: #1a0d2e; stroke: #9b59b6; stroke-width: 1.8; }
      .panel-ai     { fill: #1f0a08; stroke: #e74c3c; stroke-width: 1.8; }
      .panel-vosk   { fill: #151a00; stroke: #c0ca33; stroke-width: 1.8; }

      .badge-num { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #080b14; }
      .title-main { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 0.3px; }
      .title-sub  { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #90a4ae; }
      .node-name  { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #eceff1; }
      .node-sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #90a4ae; }
      .lbl        { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }

      .lifeline-client { stroke: #1e6fa8; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-core   { stroke: #00c49a; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-gw     { stroke: #9b59b6; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-ai     { stroke: #e74c3c; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }
      .lifeline-vosk   { stroke: #c0ca33; stroke-width: 1.2; stroke-dasharray: 5,4; opacity: 0.6; }

      .arrow-sip   { stroke: #29b6f6; stroke-width: 2; fill: none; }
      .arrow-media { stroke: #66bb6a; stroke-width: 3; fill: none; }
      .arrow-spool { stroke: #ab47bc; stroke-width: 2; fill: none; stroke-dasharray: 6,4; }
      .arrow-asr   { stroke: #d4e157; stroke-width: 2; fill: none; }
      .arrow-ai    { stroke: #ef5350; stroke-width: 2.2; fill: none; }
      .arrow-resp  { stroke-dasharray: 6,4; }

      .divider { stroke: #1e2740; stroke-width: 1.2; }
      .badge-box { fill: #0b0e17; stroke-width: 1; opacity: 0.94; rx: 4; ry: 4; }
      .note-box { fill: #0e1627; stroke: #263252; stroke-width: 1.2; rx: 4; }
    </style>

    <!-- Arrow heads -->
    <marker id="h-sip"   viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#29b6f6"/>
    </marker>
    <marker id="h-media" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#66bb6a"/>
    </marker>
    <marker id="h-spool" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#ab47bc"/>
    </marker>
    <marker id="h-asr"   viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#d4e157"/>
    </marker>
    <marker id="h-ai"    viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#ef5350"/>
    </marker>
    <marker id="h-sip-l" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#29b6f6"/>
    </marker>
    <marker id="h-ai-l"  viewBox="0 0 10 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#ef5350"/>
    </marker>
    <marker id="h-core"   viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#00c49a"/>
    </marker>
    <marker id="h-core-l" viewBox="0 0 10 8" refX="2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 4 L 10 8 z" fill="#00c49a"/>
    </marker>

    <linearGradient id="grad-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1260" height="840" fill="url(#grad-bg)"/>
  <line x1="0" y1="130" x2="1260" y2="130" class="divider"/>
  <line x1="0" y1="800" x2="1260" y2="800" class="divider"/>

  <!-- Title block -->
  <text x="30" y="36" class="title-main">IMS VoLTE / VoNR Voice Call &amp; Conference Interception Flow</text>
  <text x="30" y="56" class="title-sub">Real-Time SIP Signaling · RTPEngine Media Forking · Native Vosk STT JNI · AI Voice Decider</text>

  <!-- ═══════════ PARTICIPANT BOXES ═══════════ -->
  <!-- UE_1 (Caller) -->
  <rect x="20"  y="68" width="130" height="52" rx="7" class="panel-client"/>
  <text x="85"  y="89"  text-anchor="middle" class="node-name">SIP Caller (UE_1)</text>
  <text x="85"  y="106" text-anchor="middle" class="node-sub">15551234567 / Phone</text>
  <line x1="85"  y1="120" x2="85"  y2="780" class="lifeline-client"/>

  <!-- Kamailio -->
  <rect x="175" y="68" width="150" height="52" rx="7" class="panel-core"/>
  <text x="250" y="89"  text-anchor="middle" class="node-name">Kamailio Edge</text>
  <text x="250" y="106" text-anchor="middle" class="node-sub">SIP Proxy · :5060</text>
  <line x1="250" y1="120" x2="250" y2="780" class="lifeline-core"/>

  <!-- rtpengine -->
  <rect x="350" y="68" width="150" height="52" rx="7" class="panel-core"/>
  <text x="425" y="89"  text-anchor="middle" class="node-name">RTPEngine Proxy</text>
  <text x="425" y="106" text-anchor="middle" class="node-sub">Media Relay · :22222</text>
  <line x1="425" y1="120" x2="425" y2="780" class="lifeline-core"/>

  <!-- UE_2 / Asterisk -->
  <rect x="525" y="68" width="160" height="52" rx="7" class="panel-client"/>
  <text x="605" y="89"  text-anchor="middle" class="node-name">Callee / ConfBridge</text>
  <text x="605" y="106" text-anchor="middle" class="node-sub">UE_2 / Asterisk 7XXX</text>
  <line x1="605" y1="120" x2="605" y2="780" class="lifeline-client"/>

  <!-- telecom-api -->
  <rect x="710" y="68" width="155" height="52" rx="7" class="panel-gw"/>
  <text x="787" y="89"  text-anchor="middle" class="node-name">telecom-api</text>
  <text x="787" y="106" text-anchor="middle" class="node-sub">Spring Boot · :8080</text>
  <line x1="787" y1="120" x2="787" y2="780" class="lifeline-gw"/>

  <!-- Native Vosk ASR -->
  <rect x="890" y="68" width="165" height="52" rx="7" class="panel-vosk"/>
  <text x="972" y="89"  text-anchor="middle" class="node-name">NativeVoskService</text>
  <text x="972" y="106" text-anchor="middle" class="node-sub">Java 21 JNI In-JVM ASR</text>
  <line x1="972" y1="120" x2="972" y2="780" class="lifeline-vosk"/>

  <!-- AI Voice Decider -->
  <rect x="1080" y="68" width="160" height="52" rx="7" class="panel-ai"/>
  <text x="1160" y="89"  text-anchor="middle" class="node-name">Filteration-System</text>
  <text x="1160" y="106" text-anchor="middle" class="node-sub">AI Decider · :8081</text>
  <line x1="1160" y1="120" x2="1160" y2="780" class="lifeline-ai"/>

  <!-- ═══════════ SIGNALING STEPS ═══════════ -->

  <!-- Step 1: SIP INVITE UE1 → Kamailio -->
  <circle cx="85" cy="160" r="10" fill="#29b6f6"/>
  <text x="85" y="164" text-anchor="middle" class="badge-num">1</text>
  <line x1="95" y1="160" x2="240" y2="160" class="arrow-sip" marker-end="url(#h-sip)" />
  <rect x="115" y="148" width="105" height="16" class="badge-box" stroke="#29b6f6"/>
  <text x="167" y="160" text-anchor="middle" class="lbl" fill="#29b6f6">SIP INVITE (SDP)</text>

  <!-- Step 2: POST /api/v1/intercept/call -->
  <circle cx="250" cy="205" r="10" fill="#29b6f6"/>
  <text x="250" y="209" text-anchor="middle" class="badge-num">2</text>
  <line x1="260" y1="205" x2="777" y2="205" class="arrow-sip" marker-end="url(#h-sip)"/>
  <rect x="390" y="193" width="245" height="16" class="badge-box" stroke="#29b6f6"/>
  <text x="512" y="205" text-anchor="middle" class="lbl" fill="#29b6f6">POST /api/v1/intercept/call (OCS / EIR)</text>

  <!-- Step 3: HTTP 200 OK allow:true -->
  <circle cx="787" cy="245" r="10" fill="#29b6f6"/>
  <text x="787" y="249" text-anchor="middle" class="badge-num">3</text>
  <line x1="777" y1="245" x2="260" y2="245" class="arrow-sip arrow-resp" marker-end="url(#h-sip-l)"/>
  <rect x="420" y="233" width="190" height="16" class="badge-box" stroke="#29b6f6"/>
  <text x="515" y="245" text-anchor="middle" class="lbl" fill="#29b6f6">HTTP 200 OK { allow: true }</text>

  <!-- Step 4a: NG offer → rtpengine -->
  <circle cx="250" cy="290" r="10" fill="#00c49a"/>
  <text x="250" y="294" text-anchor="middle" class="badge-num">4a</text>
  <line x1="260" y1="290" x2="415" y2="290" class="arrow-sip" stroke="#00c49a" marker-end="url(#h-core)"/>
  <rect x="285" y="278" width="110" height="16" class="badge-box" stroke="#00c49a"/>
  <text x="340" y="290" text-anchor="middle" class="lbl" fill="#00c49a">NG offer (bind)</text>

  <!-- Step 4b: SDP answer ← rtpengine -->
  <circle cx="425" cy="325" r="10" fill="#00c49a"/>
  <text x="425" y="329" text-anchor="middle" class="badge-num">4b</text>
  <line x1="415" y1="325" x2="260" y2="325" class="arrow-sip arrow-resp" stroke="#00c49a" marker-end="url(#h-core-l)"/>
  <rect x="290" y="313" width="100" height="16" class="badge-box" stroke="#00c49a"/>
  <text x="340" y="325" text-anchor="middle" class="lbl" fill="#00c49a">SDP rewritten</text>

  <!-- Step 5: SIP INVITE → Callee / Asterisk -->
  <circle cx="250" cy="365" r="10" fill="#29b6f6"/>
  <text x="250" y="369" text-anchor="middle" class="badge-num">5</text>
  <line x1="260" y1="365" x2="595" y2="365" class="arrow-sip" marker-end="url(#h-sip)"/>
  <rect x="360" y="353" width="145" height="16" class="badge-box" stroke="#29b6f6"/>
  <text x="432" y="365" text-anchor="middle" class="lbl" fill="#29b6f6">SIP INVITE (RTP Bridge)</text>

  <!-- Step 6: 200 OK ← Callee / Asterisk -->
  <circle cx="605" cy="405" r="10" fill="#29b6f6"/>
  <text x="605" y="409" text-anchor="middle" class="badge-num">6</text>
  <line x1="595" y1="405" x2="260" y2="405" class="arrow-sip arrow-resp" marker-end="url(#h-sip-l)"/>
  <rect x="385" y="393" width="95" height="16" class="badge-box" stroke="#29b6f6"/>
  <text x="432" y="405" text-anchor="middle" class="lbl" fill="#29b6f6">SIP 200 OK</text>

  <!-- Step 7: 200 OK → Caller (Established) -->
  <circle cx="250" cy="445" r="10" fill="#29b6f6"/>
  <text x="250" y="449" text-anchor="middle" class="badge-num">7</text>
  <line x1="240" y1="445" x2="95" y2="445" class="arrow-sip arrow-resp" marker-end="url(#h-sip-l)"/>
  <rect x="115" y="433" width="105" height="16" class="badge-box" stroke="#29b6f6"/>
  <text x="167" y="445" text-anchor="middle" class="lbl" fill="#29b6f6">200 OK (Answer)</text>

  <!-- Step 8: Full-Duplex RTP Media -->
  <circle cx="85" cy="495" r="10" fill="#66bb6a"/>
  <text x="85" y="499" text-anchor="middle" class="badge-num">8</text>
  <line x1="95" y1="495" x2="595" y2="495" class="arrow-media" marker-end="url(#h-media)"/>
  <circle cx="425" cy="495" r="7" fill="#66bb6a" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="240" y="483" width="190" height="16" class="badge-box" stroke="#66bb6a"/>
  <text x="335" y="495" text-anchor="middle" class="lbl" fill="#66bb6a">Bidirectional RTP (via RTPEngine)</text>

  <!-- Step 9: Audio Fork → /var/spool/rtpengine -->
  <circle cx="425" cy="550" r="10" fill="#ab47bc"/>
  <text x="425" y="554" text-anchor="middle" class="badge-num">9</text>
  <line x1="435" y1="550" x2="962" y2="550" class="arrow-spool" marker-end="url(#h-spool)"/>
  <rect x="580" y="538" width="220" height="16" class="badge-box" stroke="#ab47bc"/>
  <text x="690" y="550" text-anchor="middle" class="lbl" fill="#ba68c8">WAV Audio Spool Fork (.wav)</text>

  <!-- Step 10: In-JVM Vosk STT Processing -->
  <rect x="850" y="585" width="245" height="26" rx="5" class="note-box" stroke="#c0ca33"/>
  <text x="972" y="602" text-anchor="middle" class="lbl" fill="#d4e157">10. Native JNI ASR · Keyword Flags</text>

  <!-- Step 11: POST /api/v1/voice/filter → Filteration-System -->
  <circle cx="972" cy="645" r="10" fill="#ef5350"/>
  <text x="972" y="649" text-anchor="middle" class="badge-num">11</text>
  <line x1="982" y1="645" x2="1150" y2="645" class="arrow-ai" marker-end="url(#h-ai)"/>
  <rect x="1000" y="633" width="140" height="16" class="badge-box" stroke="#ef5350"/>
  <text x="1070" y="645" text-anchor="middle" class="lbl" fill="#ef5350">POST /api/v1/voice/filter</text>

  <!-- Step 12: Decision Response ← Filteration-System -->
  <circle cx="1160" cy="695" r="10" fill="#ef5350"/>
  <text x="1160" y="699" text-anchor="middle" class="badge-num">12</text>
  <line x1="1150" y1="695" x2="797" y2="695" class="arrow-ai arrow-resp" marker-end="url(#h-ai-l)"/>
  <rect x="910" y="683" width="195" height="16" class="badge-box" stroke="#ef5350"/>
  <text x="1007" y="695" text-anchor="middle" class="lbl" fill="#ef5350">{ isMalicious, action: DROP/ALLOW }</text>

  <!-- Step 13: Policy Action (Enforcement) -->
  <circle cx="787" cy="745" r="10" fill="#00c49a"/>
  <text x="787" y="749" text-anchor="middle" class="badge-num">13</text>
  <line x1="777" y1="745" x2="260" y2="745" class="arrow-sip" stroke="#00c49a" marker-end="url(#h-core)"/>
  <rect x="420" y="733" width="200" height="16" class="badge-box" stroke="#00c49a"/>
  <text x="520" y="745" text-anchor="middle" class="lbl" fill="#00c49a">Blacklist Spammer / Terminate Session</text>

  <!-- Footer Legend -->
  <line x1="30"  y1="815" x2="80"  y2="815" stroke="#29b6f6" stroke-width="2"/>
  <text x="88"  y="819" class="lbl" fill="#78909c" font-size="11">SIP Signaling</text>
  <line x1="180" y1="815" x2="230" y2="815" stroke="#66bb6a" stroke-width="3"/>
  <text x="238" y="819" class="lbl" fill="#78909c" font-size="11">RTP Media</text>
  <line x1="330" y1="815" x2="380" y2="815" stroke="#ab47bc" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="388" y="819" class="lbl" fill="#78909c" font-size="11">WAV Spool</text>
  <line x1="480" y1="815" x2="530" y2="815" stroke="#d4e157" stroke-width="2"/>
  <text x="538" y="819" class="lbl" fill="#78909c" font-size="11">Vosk JNI ASR</text>
  <line x1="640" y1="815" x2="690" y2="815" stroke="#ef5350" stroke-width="2.2"/>
  <text x="698" y="819" class="lbl" fill="#78909c" font-size="11">AI Voice Decider</text>
</svg>
