<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0e17; }
      .box { fill: #131726; stroke: #262b45; stroke-width: 1.5; rx: 8; ry: 8; }
      .client-box { fill: #0d1a2d; stroke: #0288d1; stroke-width: 2; rx: 10; ry: 10; }
      .core-box { fill: #07221b; stroke: #00bfa5; stroke-width: 2; rx: 10; ry: 10; }
      .gw-box { fill: #1c102b; stroke: #ab47bc; stroke-width: 2; rx: 10; ry: 10; }
      .ai-box { fill: #280f0c; stroke: #ff5722; stroke-width: 2; rx: 10; ry: 10; }
      .obs-box { fill: #0c182b; stroke: #29b6f6; stroke-width: 2; rx: 10; ry: 10; }
      
      .text-header { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; letter-spacing: 0.3px; }
      .text-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .text-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #b0bec5; }
      .text-link { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #00e5ff; font-weight: 600; }
      .text-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      
      .arrow-cyan { stroke: #00e5ff; stroke-width: 2; fill: none; }
      .arrow-orange { stroke: #ff5722; stroke-width: 2.2; fill: none; }
      .arrow-blue { stroke: #29b6f6; stroke-width: 1.8; fill: none; stroke-dasharray: 4,4; }
      .arrow-purple { stroke: #ba68c8; stroke-width: 2; fill: none; }
      
      .badge-bg { fill: #0b0e17; stroke-width: 1; opacity: 0.94; rx: 4; ry: 4; }
    </style>

    <!-- Arrow markers -->
    <marker id="m-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00e5ff" />
    </marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff5722" />
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#29b6f6" />
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ba68c8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1360" height="840" class="bg" />

  <!-- Diagram Header -->
  <text x="40" y="38" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">MVNO Core Integration Flow &amp; Architecture Map</text>
  <text x="40" y="58" font-family="'Inter', sans-serif" font-size="12" fill="#78909c">5G SA Core · 2G Cellular Radio · Asterisk ConfBridge · Native Vosk STT · Spring Boot 3.4 AI Gate</text>

  <!-- ==================== 1. ACCESS LAYER (X: 40, W: 210, H: 735) ==================== -->
  <g transform="translate(40, 80)">
    <rect width="210" height="735" class="client-box" />
    <text x="16" y="26" class="text-header">1. Access &amp; Device Layer</text>
    
    <!-- Phone / SIP UA -->
    <g transform="translate(15, 45)">
      <rect width="180" height="110" class="box" />
      <text x="12" y="22" class="text-title">Android Phone / Softphone</text>
      <text x="12" y="42" class="text-body">• Physical Handset (Linphone)</text>
      <text x="12" y="58" class="text-body">• SIP Digest Auth (RFC 3261)</text>
      <text x="12" y="74" class="text-body">• PCMU / G.722 RTP Audio</text>
      <text x="12" y="94" class="text-link">UDP :5060 (Host IP)</text>
    </g>

    <!-- 2G Mobile Station -->
    <g transform="translate(15, 175)">
      <rect width="180" height="110" class="box" />
      <text x="12" y="22" class="text-title">2G GSM Mobile Station</text>
      <text x="12" y="42" class="text-body">• OsmocomBB Virtual MS</text>
      <text x="12" y="58" class="text-body">• GSM 03.40 SMS Inbox</text>
      <text x="12" y="74" class="text-body">• MSISDN: 15554443322</text>
      <text x="12" y="94" class="text-link">Osmocom Um Interface</text>
    </g>

    <!-- ESME Client -->
    <g transform="translate(15, 305)">
      <rect width="180" height="110" class="box" />
      <text x="12" y="22" class="text-title">SMS Client (ESME)</text>
      <text x="12" y="42" class="text-body">• A2P / P2P SMS Submit</text>
      <text x="12" y="58" class="text-body">• SMPP 3.4 submit_sm</text>
      <text x="12" y="74" class="text-body">• ESME ID: smsclient</text>
      <text x="12" y="94" class="text-link">TCP :2775 (SMPP)</text>
    </g>

    <!-- 5G SA Radio -->
    <g transform="translate(15, 435)">
      <rect width="180" height="115" class="box" />
      <text x="12" y="22" class="text-title">5G SA Radio (UERANSIM)</text>
      <text x="12" y="42" class="text-body">• Simulated gNodeB + 3 UEs</text>
      <text x="12" y="58" class="text-body">• NGAP N2 SCTP Signaling</text>
      <text x="12" y="74" class="text-body">• GTP-U N3 User Plane</text>
      <text x="12" y="94" class="text-link">SCTP :38412 / GTP-U</text>
    </g>

    <!-- Host PipeWire Audio -->
    <g transform="translate(15, 570)">
      <rect width="180" height="145" class="box" stroke="#0288d1" />
      <text x="12" y="22" class="text-title" fill="#29b6f6">Host PipeWire Audio</text>
      <text x="12" y="42" class="text-body">• Laptop HW Microphone</text>
      <text x="12" y="58" class="text-body">• Laptop HW Speakers</text>
      <text x="12" y="74" class="text-body">• Full-Duplex PulseAudio</text>
      <text x="12" y="90" class="text-body">• Zero-File Realtime Audio</text>
      <text x="12" y="112" class="text-link">Pulse Socket Mount</text>
    </g>
  </g>

  <!-- ==================== 2. MVNO NETWORK CORE (X: 360, W: 240, H: 735) ==================== -->
  <g transform="translate(360, 80)">
    <rect width="240" height="735" class="core-box" />
    <text x="16" y="26" class="text-header">2. Signaling &amp; Media Core</text>

    <!-- Kamailio -->
    <g transform="translate(15, 45)">
      <rect width="210" height="130" class="box" />
      <text x="12" y="22" class="text-title">Kamailio 5.7 SIP Edge</text>
      <text x="12" y="42" class="text-body">• Digest Auth &amp; USRLOC DB</text>
      <text x="12" y="58" class="text-body">• Prefix Normalization (+20/+1)</text>
      <text x="12" y="74" class="text-body">• Policy Route Intercept</text>
      <text x="12" y="90" class="text-body">• Jansson Body Coercion</text>
      <text x="12" y="110" class="text-link">UDP/TCP :5060 (Host)</text>
    </g>

    <!-- RTPEngine -->
    <g transform="translate(15, 195)">
      <rect width="210" height="120" class="box" />
      <text x="12" y="22" class="text-title">RTPEngine NG Proxy</text>
      <text x="12" y="42" class="text-body">• Userspace Media Relay</text>
      <text x="12" y="58" class="text-body">• Dual-Leg Audio Spooling</text>
      <text x="12" y="74" class="text-body">• DTMF RFC 2833 Intercept</text>
      <text x="12" y="96" class="text-link">RTP :10000-20000 / :22222</text>
    </g>

    <!-- Asterisk Media Server -->
    <g transform="translate(15, 335)">
      <rect width="210" height="130" class="box" stroke="#00e5ff" />
      <text x="12" y="22" class="text-title" fill="#00e5ff">Asterisk 20.6 Media Server</text>
      <text x="12" y="42" class="text-body">• ConfBridge 7XXX MCU</text>
      <text x="12" y="58" class="text-body">• Call Screening IVR 8000</text>
      <text x="12" y="74" class="text-body">• VoicemailMain 8XXX</text>
      <text x="12" y="90" class="text-body">• Multi-Party Audio Mixing</text>
      <text x="12" y="110" class="text-link">SIP Trunk :5061 (Internal)</text>
    </g>

    <!-- OsmoSMSC & HLR -->
    <g transform="translate(15, 485)">
      <rect width="210" height="110" class="box" />
      <text x="12" y="22" class="text-title">OsmoSMSC + OsmoHLR</text>
      <text x="12" y="42" class="text-body">• GSM 03.40 Store-Forward</text>
      <text x="12" y="58" class="text-body">• Standalone HLR SQLite</text>
      <text x="12" y="74" class="text-body">• Delivery Hold Hook</text>
      <text x="12" y="92" class="text-link">SMPP :2775 / GSUP :4222</text>
    </g>

    <!-- Open5GS 5GC -->
    <g transform="translate(15, 615)">
      <rect width="210" height="100" class="box" />
      <text x="12" y="22" class="text-title">Open5GS 5G SA Core</text>
      <text x="12" y="42" class="text-body">• 10 3GPP Rel-16 NFs</text>
      <text x="12" y="58" class="text-body">• PDU Session 10.45.0.0/16</text>
      <text x="12" y="74" class="text-body">• MongoDB Subscriber Store</text>
      <text x="12" y="88" class="text-link">WebUI :9999 / SBI :7777</text>
    </g>
  </g>

  <!-- ==================== 3. INTEGRATION GATEWAY (X: 700, W: 250, H: 735) ==================== -->
  <g transform="translate(700, 80)">
    <rect width="250" height="735" class="gw-box" />
    <text x="16" y="26" class="text-header">3. Policy &amp; Interception Layer</text>

    <!-- Spring Boot Gateway -->
    <g transform="translate(15, 45)">
      <rect width="220" height="160" class="box" />
      <text x="12" y="22" class="text-title">telecom-api (Spring Boot 3.4)</text>
      <text x="12" y="42" class="text-body">• Java 21 Virtual Threads</text>
      <text x="12" y="58" class="text-body">• SQLite WAL OCS Balance</text>
      <text x="12" y="74" class="text-body">• EIR SIM-Swap Fraud Tracker</text>
      <text x="12" y="90" class="text-body">• 5.0s Carrier SLA Fail-Open</text>
      <text x="12" y="106" class="text-body">• Actuator Liveness &amp; Prometheus</text>
      <text x="12" y="122" class="text-body">• REST /api/v1/intercept/*</text>
      <text x="12" y="142" class="text-link">HTTP :8080 (X-API-Key)</text>
    </g>

    <!-- Native Vosk ASR -->
    <g transform="translate(15, 225)">
      <rect width="220" height="140" class="box" stroke="#ba68c8" />
      <text x="12" y="22" class="text-title" fill="#ba68c8">Native Vosk ASR Service</text>
      <text x="12" y="42" class="text-body">• In-JVM Native C JNI</text>
      <text x="12" y="58" class="text-body">• Zero-GC Offline STT</text>
      <text x="12" y="74" class="text-body">• /var/spool/rtpengine Scan</text>
      <text x="12" y="90" class="text-body">• Silence &amp; Spectral Biometrics</text>
      <text x="12" y="106" class="text-body">• Keyword Scam Flagging</text>
      <text x="12" y="124" class="text-link">Java 21 JNI Engine</text>
    </g>

    <!-- IP-SM-GW Bridge -->
    <g transform="translate(15, 385)">
      <rect width="220" height="150" class="box" />
      <text x="12" y="22" class="text-title">IP-SM-GW Bridge (TS 23.204)</text>
      <text x="12" y="42" class="text-body">• 2G SMSC ↔ 5G SIP MESSAGE</text>
      <text x="12" y="58" class="text-body">• Polls smsc.db → SIP Forward</text>
      <text x="12" y="74" class="text-body">• Inbound SIP :5090 → SMPP</text>
      <text x="12" y="90" class="text-body">• 35/35 Passing Unit Tests</text>
      <text x="12" y="106" class="text-body">• Bare-LF &amp; CRLF Normalizer</text>
      <text x="12" y="130" class="text-link">SIP :5090 / SMPP Client</text>
    </g>

    <!-- Vector Log Pipeline -->
    <g transform="translate(15, 555)">
      <rect width="220" height="160" class="box" />
      <text x="12" y="22" class="text-title">Vector Log Pipeline</text>
      <text x="12" y="42" class="text-body">• Rust Container Log Shipper</text>
      <text x="12" y="58" class="text-body">• Regex VRL Transform</text>
      <text x="12" y="74" class="text-body">• Zero-GC Stream Processor</text>
      <text x="12" y="90" class="text-body">• Prometheus Exporter Sink</text>
      <text x="12" y="135" class="text-link">Vector Rust Daemon</text>
    </g>
  </g>

  <!-- ==================== 4. AI PLATFORM (X: 1040, W: 280, H: 330) ==================== -->
  <g transform="translate(1040, 80)">
    <rect width="280" height="330" class="ai-box" />
    <text x="16" y="26" class="text-header">4. External AI Filtration</text>

    <!-- AI Spam Classifier -->
    <g transform="translate(15, 45)">
      <rect width="250" height="125" class="box" stroke="#ff5722" />
      <text x="12" y="22" class="text-title" fill="#ff7043">AI Classifier (FastAPI/Mock)</text>
      <text x="12" y="42" class="text-body">• POST /api/v1/classify</text>
      <text x="12" y="58" class="text-body">• SMS &amp; Voice Payload Evaluation</text>
      <text x="12" y="74" class="text-body">• E2E-BLOCK → allow: false</text>
      <text x="12" y="90" class="text-body">• Carrier SLA Response &lt; 5s</text>
      <text x="12" y="108" class="text-link">HTTP :8008 (Container :8000)</text>
    </g>

    <!-- Filteration-System Voice Decider -->
    <g transform="translate(15, 185)">
      <rect width="250" height="130" class="box" stroke="#ffb74d" />
      <text x="12" y="22" class="text-title" fill="#ffb74d">Filteration-System Decider</text>
      <text x="12" y="42" class="text-body">• POST /api/v1/voice/filter</text>
      <text x="12" y="58" class="text-body">• {callerId, receiverId, transcript}</text>
      <text x="12" y="74" class="text-body">• Returns: {isMalicious, action}</text>
      <text x="12" y="90" class="text-body">• DROP_CALL / ALLOW_CALL</text>
      <text x="12" y="112" class="text-link">Spring Boot 3.4 / Port :8081</text>
    </g>
  </g>

  <!-- ==================== 5. OBSERVABILITY STACK (X: 1040, W: 280, H: 385) ==================== -->
  <g transform="translate(1040, 430)">
    <rect width="280" height="385" class="obs-box" />
    <text x="16" y="26" class="text-header">5. Carrier Observability</text>

    <!-- VictoriaMetrics -->
    <g transform="translate(15, 45)">
      <rect width="250" height="145" class="box" />
      <text x="12" y="22" class="text-title">VictoriaMetrics TSDB</text>
      <text x="12" y="42" class="text-body">• High-Performance TSDB</text>
      <text x="12" y="58" class="text-body">• vmagent Metric Scraper</text>
      <text x="12" y="74" class="text-body">• PromQL Metric Storage</text>
      <text x="12" y="90" class="text-body">• Scrapes telecom-api &amp; Vector</text>
      <text x="12" y="115" class="text-link">HTTP :8428 (API :8429)</text>
    </g>

    <!-- Grafana NOC -->
    <g transform="translate(15, 210)">
      <rect width="250" height="155" class="box" />
      <text x="12" y="22" class="text-title">Grafana NOC Dashboards</text>
      <text x="12" y="42" class="text-body">• Real-Time Unified NOC</text>
      <text x="12" y="58" class="text-body">• Active Calls &amp; RTP Packet Loss</text>
      <text x="12" y="74" class="text-body">• SMS Transit &amp; Interception Rates</text>
      <text x="12" y="90" class="text-body">• AI Scam Block Counters</text>
      <text x="12" y="130" class="text-link">HTTP :3000 (Admin Dashboard)</text>
    </g>
  </g>

  <!-- ==================== 100% STRICTLY STRAIGHT / RIGHT-ANGLED (ORTHOGONAL) ARROWS ==================== -->

  <!-- Flow 1: SIP INVITE Phone -> Kamailio (Straight Horizontal) -->
  <path d="M 235,170 L 360,170" class="arrow-cyan" marker-end="url(#m-cyan)" />
  <rect x="252" y="156" width="90" height="18" class="badge-bg" stroke="#00e5ff" />
  <text x="297" y="169" text-anchor="middle" class="text-label" fill="#00e5ff">1. SIP INVITE</text>

  <!-- Flow 2: Call Pre-Check Kamailio -> telecom-api (Straight Horizontal) -->
  <path d="M 585,170 L 700,170" class="arrow-cyan" marker-end="url(#m-cyan)" />
  <rect x="600" y="156" width="85" height="18" class="badge-bg" stroke="#00e5ff" />
  <text x="642" y="169" text-anchor="middle" class="text-label" fill="#00e5ff">2. OCS / EIR</text>

  <!-- Flow 3: Media Anchor Kamailio -> RTPEngine (Straight Vertical) -->
  <path d="M 480,210 L 480,275" class="arrow-cyan" marker-end="url(#m-cyan)" />
  <rect x="490" y="235" width="95" height="18" class="badge-bg" stroke="#00e5ff" />
  <text x="537" y="248" text-anchor="middle" class="text-label" fill="#00e5ff">3. RTP Anchor</text>

  <!-- Flow 4: ConfBridge / Feature Dial: Kamailio -> Asterisk (Straight Vertical) -->
  <path d="M 450,210 L 450,415" class="arrow-cyan" marker-end="url(#m-cyan)" />
  <rect x="365" y="355" width="85" height="18" class="badge-bg" stroke="#00e5ff" />
  <text x="407" y="368" text-anchor="middle" class="text-label" fill="#00e5ff">4. Conf 7XXX</text>

  <!-- Flow 5: Audio Fork: RTPEngine -> Vosk ASR (Straight Horizontal) -->
  <path d="M 585,335 L 700,335" class="arrow-purple" marker-end="url(#m-purple)" />
  <rect x="600" y="321" width="85" height="18" class="badge-bg" stroke="#ba68c8" />
  <text x="642" y="334" text-anchor="middle" class="text-label" fill="#ba68c8">5. WAV Spool</text>

  <!-- Flow 6: Voice Decider: telecom-api -> Filteration-System (Straight Horizontal) -->
  <path d="M 935,335 L 1040,335" class="arrow-orange" marker-end="url(#m-orange)" />
  <rect x="945" y="321" width="85" height="18" class="badge-bg" stroke="#ff5722" />
  <text x="987" y="334" text-anchor="middle" class="text-label" fill="#ff5722">6. Voice Decider</text>

  <!-- Flow 7: ESME SMS Submit: ESME -> OsmoSMSC (Strict Right-Angled / Manhattan Route) -->
  <path d="M 235,425 L 295,425 L 295,595 L 360,595" class="arrow-cyan" marker-end="url(#m-cyan)" />
  <rect x="245" y="475" width="95" height="18" class="badge-bg" stroke="#00e5ff" />
  <text x="292" y="488" text-anchor="middle" class="text-label" fill="#00e5ff">7. submit_sm</text>

  <!-- Flow 8: SMS Intercept: OsmoSMSC -> telecom-api (Strict Right-Angled / Manhattan Route) -->
  <path d="M 585,595 L 645,595 L 645,495 L 700,495" class="arrow-cyan" marker-end="url(#m-cyan)" />
  <rect x="600" y="535" width="90" height="18" class="badge-bg" stroke="#00e5ff" />
  <text x="645" y="548" text-anchor="middle" class="text-label" fill="#00e5ff">8. Intercept SMS</text>

  <!-- Flow 9: AI Classifier: telecom-api -> AI Spam Model (Straight Horizontal) -->
  <path d="M 935,170 L 1040,170" class="arrow-orange" marker-end="url(#m-orange)" />
  <rect x="945" y="156" width="85" height="18" class="badge-bg" stroke="#ff5722" />
  <text x="987" y="169" text-anchor="middle" class="text-label" fill="#ff5722">9. AI Classify</text>

  <!-- Flow 10: Metrics Scraping: vmagent -> telecom-api (Straight Horizontal) -->
  <path d="M 1040,580 L 935,580" class="arrow-blue" marker-end="url(#m-blue)" />
  <rect x="945" y="566" width="85" height="18" class="badge-bg" stroke="#29b6f6" />
  <text x="987" y="579" text-anchor="middle" class="text-label" fill="#29b6f6">10. Metrics</text>

</svg>
