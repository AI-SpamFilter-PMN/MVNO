# ==============================================================================
# MVNO Interception Core — Main Microservices Orchestration (Docker/Podman Compose)
# ==============================================================================
# Architecture, Security Design & Acronym Reference Legend:
#
# ─── 5G Standalone (5G SA) Core Functions (3GPP Rel-16 Open5GS):
# - NRF  (Network Repository Function): Service discovery directory for 5G NF registration.
# - AMF  (Access & Mobility Management Function): Terminates NGAP (SCTP) from gNB and NAS from UEs.
# - SMF  (Session Management Function): Allocates UE IPv4/IPv6, manages PDU sessions, controls UPF via PFCP.
# - UPF  (User Plane Function): Packet forwarding engine handling GTP-U encapsulation and packet routing.
# - AUSF (Authentication Server Function): Performs 5G AKA subscriber authentication via UDM credentials.
# - UDM  (Unified Data Management): Stores subscriber authentication vector & profile subscription metadata.
# - UDR  (Unified Data Repository): Underlying database storage interface for UDM and PCF.
# - PCF  (Policy Control Function): Defines QoS policies, charging parameters, and slice selection.
# - BSF  (Binding Support Function): Binds Rx/N5 session requests to specific PDU session SMFs.
# - NSSF (Network Slice Selection Function): Manages Network Slicing (SST: Slice/Service Type, SD: Slice Differentiator).
#
# ─── Radio Access Network (RAN) & Device Simulation (UERANSIM):
# - gNB  (next-Generation NodeB): 5G NR base station simulator communicating with AMF over SCTP NGAP.
# - UE   (User Equipment): Mobile subscriber device simulator generating 5G NAS control traffic.
#
# ─── Telecom Protocols & Interface Acronyms:
# - SBI  (Service-Based Interface): RESTful HTTP/2 3GPP Rel-16 microservices interface over port 7777.
#        WHY 'no_tls: true'?: Disables TLS overhead for cleartext HTTP/2 (h2c) inside isolated bridge network.
# - PFCP (Packet Forwarding Control Protocol): 3GPP TS 29.244 interface between SMF & UPF over port 8805.
#        WHY NO UPF CLIENT?: SMF is sole initiator per 3GPP specs; removing UPF client prevents dual-initiator collisions.
# - NGAP (NG Application Protocol): Control plane protocol between gNB and AMF over SCTP port 38412.
# - NAS  (Non-Access Stratum): Control plane signaling protocol between UE and AMF (Registration, Security).
# - GSUP (Generic Subscriber Update Protocol): Osmocom internal subscriber protocol over TCP port 4222.
# - SMPP (Short Message Peer-to-Peer): SMSC gateway protocol v3.4 over TCP port 2775.
# - EIR  (Equipment Identity Register): Hardware IMEI tracking module to prevent SIM-swap fraud.
#
# ─── Security & Container Rules:
# - Rootless Execution: Designed for unprivileged container engine execution (Podman default).
# - Non-Privileged Ports: All internal container ports >1024.
# - SELinux Volume Mounts: Host mounts appended with ':z' flag for SELinux context relabeling.
# - Strict Version Pinning: All images explicitly version-pinned for reproducible air-gapped deployments.
# ==============================================================================

networks:
  mvno_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:
  # ─── MongoDB Subscriber DB (5G Core Open5GS metadata store) ───
  mongodb:
    image: mongo:7.0
    container_name: mvno-mongodb
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27017:27017"
    volumes:
      - ./state/mongodb:/data/db:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.4
        aliases:
          - mongodb
    restart: unless-stopped
    healthcheck:
      test: mongosh --eval 'db.runCommand({ping:1})' --quiet
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MongoDB Exporter (Prometheus metrics for vmagent scraping) ───
  mongodb-exporter:
    image: percona/mongodb_exporter:0.41
    container_name: mvno-mongodb-exporter
    extra_hosts:
      - "mongodb:10.89.0.4"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    command:
      - "--mongodb.uri=mongodb://mongodb:27017"
      - "--collect-all"
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS Subscriber WebUI Management ───
  open5gs-webui:
    image: mvno-open5gs-webui:2.8.0
    container_name: mvno-open5gs-webui
    ports:
      - "9999:3000"
    environment:
      - DB_URI=mongodb://mongodb:27017/open5gs
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_PATH=src
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS NRF (Network Repository Function) ───
  nrf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-nrf
    environment:
      COMPONENT_NAME: nrf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/nrf.yaml:/etc/open5gs/nrf.yaml:z
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS AMF (Access and Mobility Management Function) ───
  amf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-amf
    environment:
      COMPONENT_NAME: amf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/amf.yaml:/etc/open5gs/amf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS SMF (Session Management Function) ───
  smf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-smf
    environment:
      COMPONENT_NAME: smf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/smf.yaml:/etc/open5gs/smf.yaml:z
    depends_on:
      nrf:
        condition: service_started
      upf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS UPF (User Plane Function) ───
  upf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-upf
    environment:
      COMPONENT_NAME: upf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/upf.yaml:/etc/open5gs/upf.yaml:z
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS AUSF (Authentication Server Function) ───
  ausf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-ausf
    environment:
      COMPONENT_NAME: ausf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/ausf.yaml:/etc/open5gs/ausf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS BSF (Binding Support Function) ───
  bsf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-bsf
    environment:
      COMPONENT_NAME: bsf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/bsf.yaml:/etc/open5gs/bsf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS UDM (Unified Data Management) ───
  udm:
    image: mvno-open5gs:2.8.0
    container_name: mvno-udm
    environment:
      COMPONENT_NAME: udm
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/udm.yaml:/etc/open5gs/udm.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS UDR (Unified Data Repository) ───
  udr:
    image: mvno-open5gs:2.8.0
    container_name: mvno-udr
    environment:
      COMPONENT_NAME: udr
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/udr.yaml:/etc/open5gs/udr.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS PCF (Policy Control Function) ───
  pcf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-pcf
    environment:
      COMPONENT_NAME: pcf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/pcf.yaml:/etc/open5gs/pcf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Open5GS NSSF (Network Slice Selection Function) ───
  nssf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-nssf
    environment:
      COMPONENT_NAME: nssf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/nssf.yaml:/etc/open5gs/nssf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── UERANSIM gNB (5G NR Base Station Simulator) ───
  ueransim-gnb:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-gnb
    command: ["nr-gnb", "-c", "/etc/ueransim/gnb.yaml"]
    volumes:
      - ./configs/ueransim/gnb.yaml:/etc/ueransim/gnb.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    depends_on:
      amf:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/sctp/assocs 2>/dev/null | grep -q 38412"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── UERANSIM UE-1 (Primary Subscriber IMSI 001010000000001) ───
  ueransim-ue-1:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-1
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── UERANSIM UE-2 (Spam Subscriber IMSI 001010000000002) ───
  ueransim-ue-2:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-2
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue-spam.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── UERANSIM UE-3 (Zero Balance Subscriber IMSI 001010000000003) ───
  ueransim-ue-3:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-3
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue-zero.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── RTPEngine In-Kernel Media Proxy & Audio Forker ───
  rtpengine:
    image: drachtio/rtpengine:mr9.4.0.0
    container_name: mvno-rtpengine
    command:
      - rtpengine
      - --config-file=/etc/rtpengine/rtpengine.conf
      - --listen-http=9900
    ports:
      - "30000-30100:30000-30100/udp"
      - "9900:9900"
    volumes:
      - ./configs/rtpengine:/etc/rtpengine:z
      - ./state/spool:/var/spool/rtpengine:z
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Kamailio SIP Registrar & Interception Proxy ───
  kamailio:
    image: mvno-kamailio:5.7.2
    container_name: mvno-kamailio
    ports:
      - "5066:5060/udp"
    volumes:
      - ./configs/kamailio:/etc/kamailio:z
      - ./state/kamailio/kamailio.db:/etc/kamailio/kamailio.db:z
    depends_on:
      rtpengine:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Osmocom Home Location Register (HLR) Core ───
  osmo-hlr:
    image: mvno-osmo-smsc:1.0.0
    container_name: mvno-osmo-hlr
    command: osmo-hlr -c /etc/osmocom/osmo-hlr.cfg
    volumes:
      - ./configs/osmocom:/etc/osmocom:z
      - ./state/hlr:/var/lib/osmocom:z
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/4222' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.45
    restart: unless-stopped

  # ─── Osmocom MSC & SMSC Store-and-Forward Core ───
  osmo-smsc:
    image: mvno-osmo-smsc:1.0.0
    container_name: mvno-osmosmsc
    ports:
      - "2775:2775"
    volumes:
      - ./configs/osmocom:/etc/osmocom:z
      - ./state/hlr:/var/lib/osmocom:z
    depends_on:
      - osmo-hlr
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/2775' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Spring Boot Interception Gateway & Vosk ASR JNI Runtime ───
  telecom-api:
    image: mvno-telecom-api:1.0.0
    container_name: mvno-api
    ports:
      - "8080:8080"
    volumes:
      - ./state/kamailio:/etc/kamailio:z
      - ./state/spool:/var/spool/rtpengine:z
      - ./vendor/vosk/vosk-model-small-en-us-0.15:/opt/vosk-model-small-en-us-0.15:ro,z
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── AI Spam Filtration System (Mock API Endpoint) ───
  ai-filter:
    image: python:3.11-alpine
    container_name: mvno-ai-filter
    ports:
      - "8008:8000"
    command:
      - python3
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                length = int(self.headers.get('Content-Length', 0))
                if length > 0: self.rfile.read(length)
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"allow":true,"reason":"Clean content"}')
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
        HTTPServer(('0.0.0.0', 8000), H).serve_forever()
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Vector Log Shipper ───
  vector:
    image: timberio/vector:0.44.0-alpine
    container_name: mvno-vector
    volumes:
      - ./configs/vector/vector.toml:/etc/vector/vector.toml:z
      - /run/user/${PODMAN_USER_UID:-1000}/podman/podman.sock:/var/run/docker.sock:ro,z
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── VictoriaMetrics Time-Series Database ───
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: mvno-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./state/vm-data:/victoria-metrics-data:z
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── VictoriaMetrics Telemetry Scraper (vmagent) ───
  vmagent:
    image: victoriametrics/vmagent:v1.101.0
    container_name: mvno-vmagent
    ports:
      - "8429:8429"
    command:
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - ./configs/victoria-metrics/scrape.yml:/etc/prometheus/prometheus.yml:z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped

  # ─── Grafana Real-Time Telecom NOC Dashboard ───
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: mvno-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:z
      - ./state/grafana:/var/lib/grafana:z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      - mvno_net
    restart: unless-stopped
