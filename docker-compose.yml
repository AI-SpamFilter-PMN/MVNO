# ==============================================================================
# MVNO Interception Core — Main Microservices Orchestration (Docker/Podman Compose)
# ==============================================================================
# Architecture, Security Design & Acronym Reference Legend:
#
# ─── 5G Standalone (5G SA) Core Functions (3GPP Rel-16 Open5GS):
# - NRF  (Network Repository Function): Service discovery directory for 5G NF registration.
# - AMF  (Access & Mobility Management Function): Terminates NGAP (SCTP) from gNB and NAS from UEs.
# - SMF  (Session Management Function): Allocates UE IPv4/IPv6, manages PDU sessions, controls UPF via PFCP.
# - UPF  (User Plane Function): Packet forwarding engine handling GTP-U encapsulation and packet routing.
# - AUSF (Authentication Server Function): Performs 5G AKA subscriber authentication via UDM credentials.
# - UDM  (Unified Data Management): Stores subscriber authentication vector & profile subscription metadata.
# - UDR  (Unified Data Repository): Underlying database storage interface for UDM and PCF.
# - PCF  (Policy Control Function): Defines QoS policies, charging parameters, and slice selection.
# - BSF  (Binding Support Function): Binds Rx/N5 session requests to specific PDU session SMFs.
# - NSSF (Network Slice Selection Function): Manages Network Slicing (SST: Slice/Service Type, SD: Slice Differentiator).
#
# ─── Radio Access Network (RAN) & Device Simulation (UERANSIM):
# - gNB  (next-Generation NodeB): 5G NR base station simulator communicating with AMF over SCTP NGAP.
# - UE   (User Equipment): Mobile subscriber device simulator generating 5G NAS control traffic.
#
# ─── Telecom Protocols & Interface Acronyms:
# - SBI  (Service-Based Interface): RESTful HTTP/2 3GPP Rel-16 microservices interface over port 7777.
#        WHY 'no_tls: true'?: Disables TLS overhead for cleartext HTTP/2 (h2c) inside isolated bridge network.
# - PFCP (Packet Forwarding Control Protocol): 3GPP TS 29.244 interface between SMF & UPF over port 8805.
#        WHY NO UPF CLIENT?: SMF is sole initiator per 3GPP specs; removing UPF client prevents dual-initiator collisions.
# - NGAP (NG Application Protocol): Control plane protocol between gNB and AMF over SCTP port 38412.
# - NAS  (Non-Access Stratum): Control plane signaling protocol between UE and AMF (Registration, Security).
# - GSUP (Generic Subscriber Update Protocol): Osmocom internal subscriber protocol over TCP port 4222.
# - SMPP (Short Message Peer-to-Peer): SMSC gateway protocol v3.4 over TCP port 2775.
# - EIR  (Equipment Identity Register): Hardware IMEI tracking module to prevent SIM-swap fraud.
#
# ─── Security & Container Rules:
# - Rootless Execution: Designed for unprivileged container engine execution (Podman default).
# - Non-Privileged Ports: All internal container ports >1024.
# - SELinux Volume Mounts: Host mounts appended with ':z' flag for SELinux context relabeling.
# - Strict Version Pinning: All images explicitly version-pinned for reproducible air-gapped deployments.
# ==============================================================================

networks:
  mvno_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:
  # ─── MongoDB Subscriber DB (5G Core Open5GS metadata store) ───
  mongodb:
    image: mongo:7.0
    container_name: mvno-mongodb
    command: mongod --wiredTigerCacheSizeGB 0.25 --quiet
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./state/mongodb:/data/db:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.4
        aliases:
          - mongodb
    restart: unless-stopped
    healthcheck:
      test: mongosh --eval 'db.runCommand({ping:1})' --quiet
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MongoDB Exporter (Prometheus metrics for vmagent scraping) ───
  mongodb-exporter:
    image: percona/mongodb_exporter:0.41
    container_name: mvno-mongodb-exporter
    extra_hosts:
      - "mongodb:10.89.0.4"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    command:
      - "--mongodb.uri=mongodb://mongodb:27017"
      - "--collect-all"
    networks:
      mvno_net:
        ipv4_address: 10.89.0.47
    restart: unless-stopped

  # ─── Open5GS Subscriber WebUI Management ───
  open5gs-webui:
    image: mvno-open5gs-webui:2.8.0
    container_name: mvno-open5gs-webui
    ports:
      - "9999:3000"
    environment:
      - DB_URI=mongodb://mongodb:27017/open5gs
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_PATH=src
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      mvno_net:
        ipv4_address: 10.89.0.22
    restart: unless-stopped

  # ─── Open5GS NRF (Network Repository Function) ───
  nrf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-nrf
    environment:
      COMPONENT_NAME: nrf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/nrf.yaml:/etc/open5gs/nrf.yaml:z
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      mvno_net:
        ipv4_address: 10.89.0.11
    restart: unless-stopped

  # ─── Open5GS AMF (Access and Mobility Management Function) ───
  amf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-amf
    environment:
      COMPONENT_NAME: amf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/amf.yaml:/etc/open5gs/amf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.12
    restart: unless-stopped

  # ─── Open5GS SMF (Session Management Function) ───
  smf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-smf
    environment:
      COMPONENT_NAME: smf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/smf.yaml:/etc/open5gs/smf.yaml:z
    depends_on:
      nrf:
        condition: service_started
      upf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.13
    restart: unless-stopped

  # ─── Open5GS UPF (User Plane Function) ───
  upf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-upf
    environment:
      COMPONENT_NAME: upf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/upf.yaml:/etc/open5gs/upf.yaml:z
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.14
    restart: unless-stopped

  # ─── 5G Core User-Plane L7 Deep Packet Inspection (DPI) Probe ───
  dpi-probe:
    image: docker.io/library/python:3.11-slim
    container_name: mvno-5g-dpi
    network_mode: "service:upf"
    volumes:
      - ./scripts/dpi/dpi_probe.py:/dpi_probe.py:ro,z
    command: ["python3", "-u", "/dpi_probe.py"]
    restart: unless-stopped
    depends_on:
      upf:
        condition: service_started

  # ─── Open5GS AUSF (Authentication Server Function) ───
  ausf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-ausf
    environment:
      COMPONENT_NAME: ausf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/ausf.yaml:/etc/open5gs/ausf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.15
    restart: unless-stopped

  # ─── Open5GS BSF (Binding Support Function) ───
  bsf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-bsf
    environment:
      COMPONENT_NAME: bsf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/bsf.yaml:/etc/open5gs/bsf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.16
    restart: unless-stopped

  # ─── Open5GS UDM (Unified Data Management) ───
  udm:
    image: mvno-open5gs:2.8.0
    container_name: mvno-udm
    environment:
      COMPONENT_NAME: udm
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/udm.yaml:/etc/open5gs/udm.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.17
    restart: unless-stopped

  # ─── Open5GS UDR (Unified Data Repository) ───
  udr:
    image: mvno-open5gs:2.8.0
    container_name: mvno-udr
    environment:
      COMPONENT_NAME: udr
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/udr.yaml:/etc/open5gs/udr.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.18
    restart: unless-stopped

  # ─── Open5GS PCF (Policy Control Function) ───
  pcf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-pcf
    environment:
      COMPONENT_NAME: pcf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/pcf.yaml:/etc/open5gs/pcf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.19
    restart: unless-stopped

  # ─── Open5GS NSSF (Network Slice Selection Function) ───
  nssf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-nssf
    environment:
      COMPONENT_NAME: nssf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/nssf.yaml:/etc/open5gs/nssf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.20
    restart: unless-stopped

  # ─── UERANSIM gNB (5G NR Base Station Simulator) ───
  ueransim-gnb:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-gnb
    command: ["nr-gnb", "-c", "/etc/ueransim/gnb.yaml"]
    volumes:
      - ./configs/ueransim/gnb.yaml:/etc/ueransim/gnb.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      amf:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/sctp/assocs 2>/dev/null | grep -q 38412"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.30
    restart: unless-stopped

  # ─── UERANSIM UE-1 (Primary Subscriber IMSI 001010000000001) ───
  ueransim-ue-1:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-1
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.31
    restart: unless-stopped
    # Functional healthcheck (Issue 5.8/5.9 family): the uesimtun0 interface
    # exists only while the PDU session is live — a UE that is "Up" but whose
    # session dropped shows Unhealthy here (watchdog uses the same probe to
    # trigger the auto-recover ladder). start_period covers cold-start attach.
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show uesimtun0 2>/dev/null | grep -q 'inet '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─── UERANSIM UE-2 (Spam Subscriber IMSI 001010000000002) ───
  ueransim-ue-2:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-2
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue-spam.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.32
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show uesimtun0 2>/dev/null | grep -q 'inet '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─── UERANSIM UE-3 (Zero Balance Subscriber IMSI 001010000000003) ───
  ueransim-ue-3:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-3
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue-zero.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.33
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show uesimtun0 2>/dev/null | grep -q 'inet '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─── RTPEngine In-Kernel Media Proxy & Audio Forker ───
  rtpengine:
    image: drachtio/rtpengine:mr9.4.0.0
    container_name: mvno-rtpengine
    # entrypoint: [] disables the image's /entrypoint.sh, which otherwise:
    #   1. computes MY_IP as the container's OWN eth0 addr (10.89.0.48) and
    #      sed -i's it into /etc/rtpengine.conf (root), then loads THAT first:
    #      `exec rtpengine --config-file /etc/rtpengine.conf "$@"`. Since the
    #      first --config-file wins, it overrode our hardened mounted config
    #      (advertise host IP, /var/spool/rtpengine, port 10000-20000) with
    #      unroutable 10.89.0.48 + /tmp recording-dir + 23000-32768 range.
    #   2. Does `sed -i` on the root file which is NOT bind-mounted, so it was
    #      fine before, but with our config mounted alone it'd be a no-op only
    #      if no MY_IP token — yet we bypass it entirely for determinism.
    # Cause of "phone answered but 0-down / no recording / no mic capture".
    # See docs/ISSUES.md #4.x "rtpengine entrypoint config override".
    entrypoint: []
    command:
      - rtpengine
      - --config-file=/etc/rtpengine/rtpengine.conf
      - --listen-http=9900
    ports:
      # RTP media range MUST match the UFW-allowed window (udp 10000:20000).
      # UFW accepts inbound 10000-20000 by default and DROPs higher ranges
      # (e.g. the old 30000-30100), silently blocking phone media BEFORE it
      # reaches rootlessport/pasta/rtpengine (kernel log: [UFW BLOCK]
      # IN=wlan0 ... DPT=30xxx). Align with the standard SIP RTP range.
      - "10000-20000:10000-20000/udp"
      - "9900:9900"
    volumes:
      - ./configs/rtpengine:/etc/rtpengine:z
      - ./state/spool:/var/spool/rtpengine:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.48
    restart: unless-stopped

  # ─── Kamailio SIP Registrar & Interception Proxy ───
  kamailio:
    image: mvno-kamailio:5.7.2
    container_name: mvno-kamailio
    ports:
      # Standard SIP UDP port for all clients (softphones/SipClient/Linphone).
      # Host UDP 5060 was previously held by a local Asterisk; it is now free,
      # so Kamailio is exposed directly on 5060 (matches the container's 5060).
      - "5060:5060/udp"
    volumes:
      - ./configs/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:z
      # Whole state/kamailio dir, NOT a single-file bind of kamailio.db:
      # sqlite's -wal/-shm must be shared with the host or host-side writes
      # (make init-db, provision-subscribers.sh) stay invisible to the running
      # kamailio until checkpoint+restart (caused 401 REGISTER failures).
      - ./state/kamailio:/etc/kamailio/db:z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.23
    restart: unless-stopped
    healthcheck:
      # SIP liveness: unauthenticated REGISTER -> 401 challenge (any SIP/2.0
      # reply proves the UDP listener is responsive; no DB write pre-auth).
      # Targets 10.89.0.23:5060 (Kamailio's explicit listen address) — the
      # config no longer binds 127.0.0.1 once a `listen` directive is set.
      test: ["CMD", "sh", "-c", "printf 'REGISTER sip:mvno.local SIP/2.0\\r\\nVia: SIP/2.0/UDP 10.89.0.23:5060;branch=z9hG4bKhc\\r\\nFrom: <sip:15551234567@mvno.local>;tag=hc\\r\\nTo: <sip:15551234567@mvno.local>\\r\\nCall-ID: hc@mvno.local\\r\\nCSeq: 1 REGISTER\\r\\nContact: <sip:15551234567@10.89.0.23:5060>\\r\\nExpires: 30\\r\\nContent-Length: 0\\r\\n\\r\\n' | socat -T3 - UDP4:10.89.0.23:5060 | grep -q 'SIP/2.0' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Osmocom Home Location Register (HLR) Core ───
  osmo-hlr:
    image: mvno-osmo-smsc:1.0.0
    container_name: mvno-osmo-hlr
    command: osmo-hlr -c /etc/osmocom/osmo-hlr.cfg --db-upgrade
    volumes:
      - ./configs/osmocom:/etc/osmocom:z
      - ./state/hlr:/var/lib/osmocom:z
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/4222' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.45
    restart: unless-stopped

  # ─── Osmocom MSC & SMSC Store-and-Forward Core ───
  osmo-smsc:
    image: mvno-osmo-smsc:1.0.0
    container_name: mvno-osmosmsc
    ports:
      - "2775:2775"
    volumes:
      - ./configs/osmocom:/etc/osmocom:z
      - ./state/hlr:/var/lib/osmocom:z
    depends_on:
      - osmo-hlr
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/2775' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.49
    restart: unless-stopped

  # ─── Osmocom 2G BSS Core (BTS-virtual + BSC + STP + MGW) ───
  2g-core:
    image: mvno-2g-core:1.0.0
    container_name: mvno-2g-core
    command: ["/etc/osmocom/entrypoint-core.sh"]
    volumes:
      - ./configs/2g:/etc/osmocom:z
    depends_on:
      - osmo-smsc
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/4239' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.50
    restart: unless-stopped

  # ─── OsmocomBB 2G Mobile Station (virtphy + mobile handset) ───
  2g-ms:
    image: mvno-2g-ms:1.0.0
    container_name: mvno-2g-ms
    command: ["/etc/osmocom/entrypoint-ms.sh"]
    volumes:
      - ./configs/2g:/etc/osmocom:z
    depends_on:
      - 2g-core
    networks:
      mvno_net:
        ipv4_address: 10.89.0.51
    restart: unless-stopped

  # ─── OsmocomBB 2G Mobile Station #2 (IMSI 001010000000005) ───
  2g-ms2:
    image: mvno-2g-ms:1.0.0
    container_name: mvno-2g-ms2
    command: ["/etc/osmocom/entrypoint-ms.sh"]
    volumes:
      - ./configs/2g-ms2:/etc/osmocom:z
    depends_on:
      - 2g-core
    networks:
      mvno_net:
        ipv4_address: 10.89.0.52
    restart: unless-stopped

  # ─── IP-SM-GW Bridge (TS 23.204: 2G SMSC <-> 5G/IMS SMS interworking) ───
  ip-sm-gw:
    image: python:3.11-alpine
    container_name: mvno-ip-sm-gw
    command: ["python3", "-u", "/scripts/ip_sm_gw.py"]
    ports:
      - "9100:9100"
    volumes:
      - ./scripts:/scripts:z
      - ./state/hlr:/var/lib/osmocom:z
    environment:
      - SMSC_DB=/var/lib/osmocom/smsc.db
      - HLR_DB=/var/lib/osmocom/hlr.db
      - KAMAILIO_HOST=10.89.0.23
      - KAMAILIO_PORT=5060
      - SMPP_HOST=10.89.0.49
      - SMPP_PORT=2775
      - SIP_BIND=0.0.0.0
      - SIP_PORT=5090
      - METRICS_PORT=9100
      - POLL_INTERVAL=3
      - REGISTER_REFRESH=60   # 2G-AoR usrloc refresh (60s bounds the silent 5G->2G window)
    depends_on:
      - kamailio
      - osmo-hlr
      - osmo-smsc
    networks:
      mvno_net:
        ipv4_address: 10.89.0.53
    restart: unless-stopped
    # Functional healthcheck: /health reflects the LIVE 2G-AoR registration
    # state (ip_sm_gw.py tracks the last successful REGISTER per AoR). The
    # bridge's own 30s retry loop self-heals, and the watchdog restarts the
    # bridge if registrations are lost — this check makes that state visible
    # instead of "Up but 5G->2G dead" (Issue 8.38 family).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ─── Spring Boot Interception Gateway & Vosk ASR JNI Runtime ───
  telecom-api:
    image: mvno-telecom-api:1.0.0
    container_name: mvno-api
    ports:
      - "8080:8080"
    environment:
      # Vosk model: default to the SMALL model (vosk-model-small-en-us-0.15) for the
      # 5-repo demo day — it frees ~1.5-2 GiB peak RAM and loads ~30-60x faster, and is
      # accurate enough for the demo's word/phrase scam-flagging. Override via .env
      # (VOSK_MODEL_PATH + VOSK_MODEL_SRC) to the LARGE model for accuracy-heavy segments.
      - VOSK_MODEL_PATH=${VOSK_MODEL_PATH:-/opt/vosk-model-small-en-us-0.15}
      - JAVA_TOOL_OPTIONS=-Xmx768m
      # Filteration-System decider: override ai-filter.url at deploy time so the
      # real decider replaces the inline mock for the graduation demo.
      #   AI_FILTER_URL=http://filteration-system:8000/api/v1/classify
      - AI_FILTER_URL=${AI_FILTER_URL:-http://ai-filter:8000/api/v1/classify}
      # Filteration-System voice-filter endpoint (real-order decider contract):
      #   POST /api/v1/voice/filter {callerId, receiverId, transcript}
      - FILTERATION_VOICE_URL=${FILTERATION_VOICE_URL:-http://filteration-system:8000/api/v1/voice/filter}
    volumes:
      - ./telecom-api/target/intercept-gateway-1.0.0.jar:/app/app.jar:z
      - ./state/kamailio:/etc/kamailio:z
      - ./state/spool:/var/spool/rtpengine:z
      # Model source dir maps to the container path selected above (default small).
      - ${VOSK_MODEL_SRC:-./vendor/vosk/vosk-model-small-en-us-0.15}:/opt/vosk-model-small-en-us-0.15:ro,z
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    mem_limit: 6g
    # json-file driver: rootless podman 6 + journald logs nothing to `podman logs`
    # (verified 2026-08-09) — flag_watch.sh tails podman logs for verdict lines.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    networks:
      mvno_net:
        ipv4_address: 10.89.0.46 # static pin required: unpinned services get auto-allocated IPs that collide with pinned ones (IPAM conflict on network recreate)
    restart: unless-stopped

  # ─── AI Spam Filtration System (Mock API Endpoint) ───
  ai-filter:
    image: python:3.11-alpine
    container_name: mvno-ai-filter
    ports:
      - "8008:8000"
    healthcheck:
      # 127.0.0.1 explicit: busybox wget resolves localhost -> ::1 (IPv6) first,
      # and the mock binds IPv4 0.0.0.0 only (connection refused, no fallback).
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - python3
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        import json
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                if self.headers.get('Transfer-Encoding', '').lower() == 'chunked':
                    body = b''
                    while True:
                        line = self.rfile.readline().strip()
                        if not line:
                            break
                        size = int(line, 16)
                        if size == 0:
                            self.rfile.readline()
                            break
                        body += self.rfile.read(size)
                        self.rfile.readline()
                else:
                    length = int(self.headers.get('Content-Length', 0))
                    body = self.rfile.read(length) if length > 0 else b''
                text = body.decode('utf-8', errors='ignore')
                if 'E2E-BLOCK' in text:
                    resp = b'{"allow":false,"reason":"Spam (E2E deterministic block)"}'
                else:
                    # Deterministic demo rules. The E2E-BLOCK marker above is authoritative
                    # for ALL event types (certified by the e2e gate AI-block cell). In
                    # addition, post-call TRANSCRIPT events are blocked on scam keywords
                    # so a real scam call recording (Vosk ASR -> mock) is blocked end-to-end
                    # and mvno_vosk_blocked_total increments. SMS/VOICE_CALL are unaffected.
                    # Words are matched on word boundaries and verified to survive Vosk
                    # small-model ASR (e.g. "You have won a prize, call us now" -> Vosk:
                    # "you have won an prize called us out"). Demo scam script:
                    #   "You have won a prize, call us now"
                    allow = True
                    reason = "Clean content"
                    try:
                        import re
                        payload = json.loads(text)
                        if payload.get("event_type") == "TRANSCRIPT":
                            t = (payload.get("transcript") or "").lower()
                            words = ["won", "prize", "claim", "free", "urgent", "account", "blocked", "confirm"]
                            if any(re.search(r"\b" + w + r"\b", t) for w in words):
                                allow = False
                                reason = "Spam (phishing phrase detected)"
                    except Exception:
                        pass
                    resp = json.dumps({"allow": allow, "reason": reason}).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(resp)
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
        HTTPServer(('0.0.0.0', 8000), H).serve_forever()
    networks:
      mvno_net:
        ipv4_address: 10.89.0.44
    restart: unless-stopped

  # ─── Filteration-System Voice Decider (POST /api/v1/voice/filter) ───
  # LIVE voice-filter decider for telecom-api. AiFilterService.tryVoiceFilter
  # POSTs {callerId, receiverId, transcript} here and REQUIRES a real verdict
  # {isMalicious, action: DROP_CALL|ALLOW_CALL} instead of failing open. This
  # decider implements the org-documented deterministic layer
  # (docs/filteration-system-handoff.md §4) so the verdict is real, deterministic
  # and reproducible offline — no dependency on an external AI gateway that would
  # otherwise throw and fail-open. Physical decision authority can be swapped for
  # the Filteration-System Spring Boot app by re-pointing FILTERATION_VOICE_URL.
  filteration-system:
    image: python:3.11-alpine
    container_name: mvno-filteration-system
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        import json, re
        WORDS = ["won", "prize", "claim", "free", "urgent", "account",
                 "blocked", "confirm", "verify", "transfer", "password", "bank"]
        class H(BaseHTTPRequestHandler):
            def log_message(self, *a):
                # Keep a plain request trace (e.g. "RX "POST /api/v1/voice/filter" 200")
                # in `podman logs`; default http.server log_message writes to stderr.
                print("RX " + " ".join(str(x) for x in a), flush=True)
            def _verdict(self, transcript):
                # Deterministic demo layer (handoff.md §4); VOICE-E2E-BLOCK is the
                # authoritative marker for deterministic blocked calls.
                t = (transcript or "").lower()
                if 'VOICE-E2E-BLOCK' in (transcript or "").upper():
                    return True
                return any(re.search(r"(?<![a-z])" + re.escape(w) + r"(?![a-z])", t) for w in WORDS)
            def do_POST(self):
                if self.path != '/api/v1/voice/filter':
                    self.send_error(404)
                    return
                if self.headers.get('Transfer-Encoding', '').lower() == 'chunked':
                    raw = b''
                    while True:
                        line = self.rfile.readline().strip()
                        if not line:
                            break
                        size = int(line, 16)
                        if size == 0:
                            self.rfile.readline()
                            break
                        raw += self.rfile.read(size)
                        self.rfile.readline()
                else:
                    length = int(self.headers.get('Content-Length', 0))
                    raw = self.rfile.read(length) if length > 0 else b''
                print("BODY " + raw.decode('utf-8', errors='replace'), flush=True)
                try:
                    payload = json.loads(raw or b'{}')
                    transcript = payload.get('transcript') or ''
                except Exception:
                    transcript = ''
                is_malicious = self._verdict(transcript)
                action = 'DROP_CALL' if is_malicious else 'ALLOW_CALL'
                body = json.dumps({'isMalicious': is_malicious, 'action': action}).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def do_GET(self):
                if self.path == '/health':
                    self.send_response(200)
                    self.end_headers()
                    self.wfile.write(b'OK')
                    return
                self.send_error(404)
        ThreadingHTTPServer(('0.0.0.0', 8000), H).serve_forever()
    networks:
      mvno_net:
        ipv4_address: 10.89.0.65
    restart: unless-stopped

  # ─── Vector Log Shipper ───
  vector:
    image: timberio/vector:0.44.0-alpine
    container_name: mvno-vector
    # Runtime-agnostic container socket: defaults to the rootless Podman socket
    # (set by up.sh via PODMAN_USER_UID). Docker users override with, e.g.:
    #   DOCKER_SOCK=/var/run/docker.sock podman compose up -d
    # or add `DOCKER_SOCK=/var/run/docker.sock` to a top-level .env file.
    environment:
      VECTOR_LOG: error
    # Explicit --config: the vector image ships /etc/vector/vector.yaml
    # (demo_logs syslog generator + pretty console sink). Vector's default
    # config search finds vector.yaml FIRST, so without this argument the
    # real pipeline below was never loaded.
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./configs/vector/vector.toml:/etc/vector/vector.toml:z
      - ./state/logs/vector:/var/log/vector:z
      - ${DOCKER_SOCK:-/run/user/${PODMAN_USER_UID:-1000}/podman/podman.sock}:/var/run/docker.sock:ro,z
    depends_on:
      victorialogs:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.40
    restart: unless-stopped

  # ─── VictoriaMetrics Time-Series Database ───
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.147.0
    container_name: mvno-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./state/vm-data:/victoria-metrics-data:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.41
    restart: unless-stopped

  # ─── VictoriaLogs Log Database (ROADMAP item 3: persistent log sink) ───
  victorialogs:
    # v1.52.0 pinned (2026-07-16 build, digest 8f2140dc...) per repo image-pinning
    # convention (cb949e4: align VictoriaMetrics image pins) — :latest is drift.
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: mvno-victorialogs
    ports:
      - "9428:9428"
    # -retentionPeriod=7d: lightweight footprint (logs are operational evidence,
    # not archive). Distroless image (no shell/tools) — healthcheck fallback:
    # vector depends_on service_started (see ROADMAP item 4 documented fallback).
    command: ["-retentionPeriod=7d"]
    volumes:
      - ./state/victorialogs:/victoria-logs-data:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.57
    restart: unless-stopped

  # ─── VictoriaMetrics Telemetry Scraper (vmagent) ───
  vmagent:
    image: victoriametrics/vmagent:v1.147.0
    container_name: mvno-vmagent
    ports:
      - "8429:8429"
    command:
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - ./configs/victoria-metrics/scrape.yml:/etc/prometheus/prometheus.yml:z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.42
    restart: unless-stopped

  # ─── Grafana Real-Time Telecom NOC Dashboard ───
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: mvno-grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:z
      - ./state/grafana:/var/lib/grafana:U
      # Official VictoriaLogs datasource plugin (v0.31.0), vendored offline by
      # bootstrap.sh into vendor/grafana-plugins — GF_INSTALL_PLUGINS would need
      # grafana.com network at boot and is intentionally NOT used.
      - ./vendor/grafana-plugins/victoriametrics-logs-datasource:/var/lib/grafana/plugins/victoriametrics-logs-datasource:ro,z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.43
    restart: unless-stopped

  # ─── Local Neon clone (dev/flag-pipeline Postgres) ───
  # Read-only mirror of the production Neon DB (cloned by scripts/neon/clone.sh
  # via pg_dump from NEON_DB_URL — production is NEVER written to). The
  # flag-for-review pipeline writes rows here; DB-Changes.md documents the
  # equivalent SQL for the live production DB on Neon.
  neon-local:
    image: docker.io/library/postgres:18-alpine
    container_name: mvno-neon-local
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=neondb
      - POSTGRES_USER=mvno
      - POSTGRES_PASSWORD=mvno
    volumes:
      - ./state/neon-local:/var/lib/postgresql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvno -d neondb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.62
    restart: unless-stopped

  # ─── Live-demo baresip rig (SIP UAs: laptop mic <-> phone) ───
  # Compose-managed since the cold-start fragmentation fix: `make up` brings
  # them up, `make clean` removes them (no more stale-registration orphans).
  # Config/accounts are written by `scripts/testing/demo_call.sh setup` into
  # ./state/baresip/{rx,tx} (mounted at /cfg). The pulse socket + cookie are
  # mounted so baresip's pulse.so captures the real laptop HW mic and plays
  # the remote leg on the laptop speakers (Issue 8.47 proven recipe). The
  # host pulse paths default to uid 1000; override via PULSE_SOCK/PULSE_DIR/
  # PULSE_COOKIE env when running as a different user.
  baresip-rx:
    image: mvno-baresip:1.1.0
    container_name: baresip-rx
    security_opt:
      - label=disable
    environment:
      - PULSE_SERVER=unix:${PULSE_SOCK:-/run/user/1000/pulse/native}
      - XDG_RUNTIME_DIR=${PULSE_DIR:-/run/user/1000}
    volumes:
      - ./state/baresip/rx:/cfg:z
      - ./state/baresip/speech8k.wav:/media/speech8k.wav:ro
      - ${PULSE_SOCK:-/run/user/1000/pulse/native}:${PULSE_SOCK:-/run/user/1000/pulse/native}:ro
      - ${PULSE_COOKIE:-/home/zkhattab/.config/pulse/cookie}:${PULSE_DIR:-/run/user/1000}/pulse/cookie:ro
    networks:
      mvno_net:
        ipv4_address: 10.89.0.60
    restart: unless-stopped

  baresip-tx:
    image: mvno-baresip:1.1.0
    container_name: baresip-tx
    security_opt:
      - label=disable
    environment:
      - PULSE_SERVER=unix:${PULSE_SOCK:-/run/user/1000/pulse/native}
      - XDG_RUNTIME_DIR=${PULSE_DIR:-/run/user/1000}
    volumes:
      - ./state/baresip/tx:/cfg:z
      - ${PULSE_SOCK:-/run/user/1000/pulse/native}:${PULSE_SOCK:-/run/user/1000/pulse/native}:ro
      - ${PULSE_COOKIE:-/home/zkhattab/.config/pulse/cookie}:${PULSE_DIR:-/run/user/1000}/pulse/cookie:ro
    networks:
      mvno_net:
        ipv4_address: 10.89.0.61
    restart: unless-stopped

  # ─── Asterisk media server (conference / voicemail / call screening) ───
  # Sits BEHIND Kamailio on a SIP trunk (:5061): Kamailio stays the edge
  # proxy/registrar/interceptor, Asterisk adds the media-plane features
  # (ConfBridge mixing, IVR, voicemail) that rtpengine cannot. Distro-agnostic
  # Debian container — runs identically on the CachyOS host and Ubuntu
  # teammates. Feature numbers: 7XXXX conference, 8XXX voicemail, 8000
  # screening. Media RTP 10000-20000/udp (inside the UFW-allowed window).
  asterisk:
    image: mvno-asterisk:1.0.0
    container_name: mvno-asterisk
    volumes:
      - ./configs/asterisk:/etc/asterisk:z
      - ./state/asterisk:/var/spool/asterisk:z
      - ./state/asterisk/log:/var/log/asterisk:z
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.63
    restart: unless-stopped
