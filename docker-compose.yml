# ==============================================================================
# MVNO Interception Core — Main Microservices Orchestration (Docker/Podman Compose)
# ==============================================================================
# Architecture, Security Design & Acronym Reference Legend:
#
# ─── 5G Standalone (5G SA) Core Functions (3GPP Rel-16 Open5GS):
# - NRF  (Network Repository Function): Service discovery directory for 5G NF registration.
# - AMF  (Access & Mobility Management Function): Terminates NGAP (SCTP) from gNB and NAS from UEs.
# - SMF  (Session Management Function): Allocates UE IPv4/IPv6, manages PDU sessions, controls UPF via PFCP.
# - UPF  (User Plane Function): Packet forwarding engine handling GTP-U encapsulation and packet routing.
# - AUSF (Authentication Server Function): Performs 5G AKA subscriber authentication via UDM credentials.
# - UDM  (Unified Data Management): Stores subscriber authentication vector & profile subscription metadata.
# - UDR  (Unified Data Repository): Underlying database storage interface for UDM and PCF.
# - PCF  (Policy Control Function): Defines QoS policies, charging parameters, and slice selection.
# - BSF  (Binding Support Function): Binds Rx/N5 session requests to specific PDU session SMFs.
# - NSSF (Network Slice Selection Function): Manages Network Slicing (SST: Slice/Service Type, SD: Slice Differentiator).
#
# ─── Radio Access Network (RAN) & Device Simulation (UERANSIM):
# - gNB  (next-Generation NodeB): 5G NR base station simulator communicating with AMF over SCTP NGAP.
# - UE   (User Equipment): Mobile subscriber device simulator generating 5G NAS control traffic.
#
# ─── Telecom Protocols & Interface Acronyms:
# - SBI  (Service-Based Interface): RESTful HTTP/2 3GPP Rel-16 microservices interface over port 7777.
#        WHY 'no_tls: true'?: Disables TLS overhead for cleartext HTTP/2 (h2c) inside isolated bridge network.
# - PFCP (Packet Forwarding Control Protocol): 3GPP TS 29.244 interface between SMF & UPF over port 8805.
#        WHY NO UPF CLIENT?: SMF is sole initiator per 3GPP specs; removing UPF client prevents dual-initiator collisions.
# - NGAP (NG Application Protocol): Control plane protocol between gNB and AMF over SCTP port 38412.
# - NAS  (Non-Access Stratum): Control plane signaling protocol between UE and AMF (Registration, Security).
# - GSUP (Generic Subscriber Update Protocol): Osmocom internal subscriber protocol over TCP port 4222.
# - SMPP (Short Message Peer-to-Peer): SMSC gateway protocol v3.4 over TCP port 2775.
# - EIR  (Equipment Identity Register): Hardware IMEI tracking module to prevent SIM-swap fraud.
#
# ─── Security & Container Rules:
# - Rootless Execution: Designed for unprivileged container engine execution (Podman default).
# - Non-Privileged Ports: All internal container ports >1024.
# - SELinux Volume Mounts: Host mounts appended with ':z' flag for SELinux context relabeling.
# - Strict Version Pinning: All images explicitly version-pinned for reproducible air-gapped deployments.
# ==============================================================================

networks:
  mvno_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:
  # ─── MongoDB Subscriber DB (5G Core Open5GS metadata store) ───
  mongodb:
    image: mongo:7.0
    container_name: mvno-mongodb
    command: mongod --wiredTigerCacheSizeGB 0.25 --quiet
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./state/mongodb:/data/db:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.4
        aliases:
          - mongodb
    restart: unless-stopped
    healthcheck:
      test: mongosh --eval 'db.runCommand({ping:1})' --quiet
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MongoDB Exporter (Prometheus metrics for vmagent scraping) ───
  mongodb-exporter:
    image: percona/mongodb_exporter:0.41
    container_name: mvno-mongodb-exporter
    extra_hosts:
      - "mongodb:10.89.0.4"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    command:
      - "--mongodb.uri=mongodb://mongodb:27017"
      - "--collect-all"
    networks:
      mvno_net:
        ipv4_address: 10.89.0.47
    restart: unless-stopped

  # ─── Open5GS Subscriber WebUI Management ───
  open5gs-webui:
    image: mvno-open5gs-webui:2.8.0
    container_name: mvno-open5gs-webui
    ports:
      - "9999:3000"
    environment:
      - DB_URI=mongodb://mongodb:27017/open5gs
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_PATH=src
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      mvno_net:
        ipv4_address: 10.89.0.22
    restart: unless-stopped

  # ─── Open5GS NRF (Network Repository Function) ───
  nrf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-nrf
    environment:
      COMPONENT_NAME: nrf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/nrf.yaml:/etc/open5gs/nrf.yaml:z
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      mvno_net:
        ipv4_address: 10.89.0.11
    restart: unless-stopped

  # ─── Open5GS AMF (Access and Mobility Management Function) ───
  amf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-amf
    environment:
      COMPONENT_NAME: amf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/amf.yaml:/etc/open5gs/amf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.12
    restart: unless-stopped

  # ─── Open5GS SMF (Session Management Function) ───
  smf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-smf
    environment:
      COMPONENT_NAME: smf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/smf.yaml:/etc/open5gs/smf.yaml:z
    depends_on:
      nrf:
        condition: service_started
      upf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.13
    restart: unless-stopped

  # ─── Open5GS UPF (User Plane Function) ───
  upf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-upf
    environment:
      COMPONENT_NAME: upf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/upf.yaml:/etc/open5gs/upf.yaml:z
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.14
    restart: unless-stopped

  # ─── Open5GS AUSF (Authentication Server Function) ───
  ausf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-ausf
    environment:
      COMPONENT_NAME: ausf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/ausf.yaml:/etc/open5gs/ausf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.15
    restart: unless-stopped

  # ─── Open5GS BSF (Binding Support Function) ───
  bsf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-bsf
    environment:
      COMPONENT_NAME: bsf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/bsf.yaml:/etc/open5gs/bsf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.16
    restart: unless-stopped

  # ─── Open5GS UDM (Unified Data Management) ───
  udm:
    image: mvno-open5gs:2.8.0
    container_name: mvno-udm
    environment:
      COMPONENT_NAME: udm
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/udm.yaml:/etc/open5gs/udm.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.17
    restart: unless-stopped

  # ─── Open5GS UDR (Unified Data Repository) ───
  udr:
    image: mvno-open5gs:2.8.0
    container_name: mvno-udr
    environment:
      COMPONENT_NAME: udr
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/udr.yaml:/etc/open5gs/udr.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.18
    restart: unless-stopped

  # ─── Open5GS PCF (Policy Control Function) ───
  pcf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-pcf
    environment:
      COMPONENT_NAME: pcf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/pcf.yaml:/etc/open5gs/pcf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.19
    restart: unless-stopped

  # ─── Open5GS NSSF (Network Slice Selection Function) ───
  nssf:
    image: mvno-open5gs:2.8.0
    container_name: mvno-nssf
    environment:
      COMPONENT_NAME: nssf
      DB_URI: mongodb://mongodb/open5gs
    volumes:
      - ./configs/open5gs/nssf.yaml:/etc/open5gs/nssf.yaml:z
    depends_on:
      nrf:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.20
    restart: unless-stopped

  # ─── UERANSIM gNB (5G NR Base Station Simulator) ───
  ueransim-gnb:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-gnb
    command: ["nr-gnb", "-c", "/etc/ueransim/gnb.yaml"]
    volumes:
      - ./configs/ueransim/gnb.yaml:/etc/ueransim/gnb.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      amf:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/sctp/assocs 2>/dev/null | grep -q 38412"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.30
    restart: unless-stopped

  # ─── UERANSIM UE-1 (Primary Subscriber IMSI 001010000000001) ───
  ueransim-ue-1:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-1
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.31
    restart: unless-stopped
    # Functional healthcheck (Issue 5.8/5.9 family): the uesimtun0 interface
    # exists only while the PDU session is live — a UE that is "Up" but whose
    # session dropped shows Unhealthy here (watchdog uses the same probe to
    # trigger the auto-recover ladder). start_period covers cold-start attach.
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show uesimtun0 2>/dev/null | grep -q 'inet '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─── UERANSIM UE-2 (Spam Subscriber IMSI 001010000000002) ───
  ueransim-ue-2:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-2
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue-spam.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.32
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show uesimtun0 2>/dev/null | grep -q 'inet '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─── UERANSIM UE-3 (Zero Balance Subscriber IMSI 001010000000003) ───
  ueransim-ue-3:
    image: mvno-ueransim:3.2.6
    container_name: mvno-ueransim-ue-3
    command: ["nr-ue", "-c", "/etc/ueransim/ue.yaml"]
    volumes:
      - ./configs/ueransim/ue-zero.yaml:/etc/ueransim/ue.yaml:z
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      ueransim-gnb:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.33
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ip -4 addr show uesimtun0 2>/dev/null | grep -q 'inet '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─── RTPEngine In-Kernel Media Proxy & Audio Forker ───
  rtpengine:
    image: drachtio/rtpengine:mr9.4.0.0
    container_name: mvno-rtpengine
    command:
      - rtpengine
      - --config-file=/etc/rtpengine/rtpengine.conf
      - --listen-http=9900
    ports:
      - "30000-30100:30000-30100/udp"
      - "9900:9900"
    volumes:
      - ./configs/rtpengine:/etc/rtpengine:z
      - ./state/spool:/var/spool/rtpengine:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.48
    restart: unless-stopped

  # ─── Kamailio SIP Registrar & Interception Proxy ───
  kamailio:
    image: mvno-kamailio:5.7.2
    container_name: mvno-kamailio
    ports:
      - "5066:5060/udp"
    volumes:
      - ./configs/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:z
      # Whole state/kamailio dir, NOT a single-file bind of kamailio.db:
      # sqlite's -wal/-shm must be shared with the host or host-side writes
      # (make init-db, provision-subscribers.sh) stay invisible to the running
      # kamailio until checkpoint+restart (caused 401 REGISTER failures).
      - ./state/kamailio:/etc/kamailio/db:z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.23
    restart: unless-stopped
    healthcheck:
      # SIP liveness: unauthenticated REGISTER -> 401 challenge (any SIP/2.0
      # reply proves the UDP listener is responsive; no DB write pre-auth).
      test: ["CMD", "sh", "-c", "printf 'REGISTER sip:mvno.local SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:5060;branch=z9hG4bKhc\\r\\nFrom: <sip:15551234567@mvno.local>;tag=hc\\r\\nTo: <sip:15551234567@mvno.local>\\r\\nCall-ID: hc@mvno.local\\r\\nCSeq: 1 REGISTER\\r\\nContact: <sip:15551234567@127.0.0.1:5060>\\r\\nExpires: 30\\r\\nContent-Length: 0\\r\\n\\r\\n' | socat -T3 - UDP4:127.0.0.1:5060 | grep -q 'SIP/2.0' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Osmocom Home Location Register (HLR) Core ───
  osmo-hlr:
    image: mvno-osmo-smsc:1.0.0
    container_name: mvno-osmo-hlr
    command: osmo-hlr -c /etc/osmocom/osmo-hlr.cfg --db-upgrade
    volumes:
      - ./configs/osmocom:/etc/osmocom:z
      - ./state/hlr:/var/lib/osmocom:z
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/4222' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.45
    restart: unless-stopped

  # ─── Osmocom MSC & SMSC Store-and-Forward Core ───
  osmo-smsc:
    image: mvno-osmo-smsc:1.0.0
    container_name: mvno-osmosmsc
    ports:
      - "2775:2775"
    volumes:
      - ./configs/osmocom:/etc/osmocom:z
      - ./state/hlr:/var/lib/osmocom:z
    depends_on:
      - osmo-hlr
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/2775' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.49
    restart: unless-stopped

  # ─── Osmocom 2G BSS Core (BTS-virtual + BSC + STP + MGW) ───
  2g-core:
    image: mvno-2g-core:1.0.0
    container_name: mvno-2g-core
    command: ["/etc/osmocom/entrypoint-core.sh"]
    volumes:
      - ./configs/2g:/etc/osmocom:z
    depends_on:
      - osmo-smsc
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/4239' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.50
    restart: unless-stopped

  # ─── OsmocomBB 2G Mobile Station (virtphy + mobile handset) ───
  2g-ms:
    image: mvno-2g-ms:1.0.0
    container_name: mvno-2g-ms
    command: ["/etc/osmocom/entrypoint-ms.sh"]
    volumes:
      - ./configs/2g:/etc/osmocom:z
    depends_on:
      - 2g-core
    networks:
      mvno_net:
        ipv4_address: 10.89.0.51
    restart: unless-stopped

  # ─── OsmocomBB 2G Mobile Station #2 (IMSI 001010000000005) ───
  2g-ms2:
    image: mvno-2g-ms:1.0.0
    container_name: mvno-2g-ms2
    command: ["/etc/osmocom/entrypoint-ms.sh"]
    volumes:
      - ./configs/2g-ms2:/etc/osmocom:z
    depends_on:
      - 2g-core
    networks:
      mvno_net:
        ipv4_address: 10.89.0.52
    restart: unless-stopped

  # ─── IP-SM-GW Bridge (TS 23.204: 2G SMSC <-> 5G/IMS SMS interworking) ───
  ip-sm-gw:
    image: python:3.11-alpine
    container_name: mvno-ip-sm-gw
    command: ["python3", "-u", "/scripts/ip_sm_gw.py"]
    ports:
      - "9100:9100"
    volumes:
      - ./scripts:/scripts:z
      - ./state/hlr:/var/lib/osmocom:z
    environment:
      - SMSC_DB=/var/lib/osmocom/smsc.db
      - HLR_DB=/var/lib/osmocom/hlr.db
      - KAMAILIO_HOST=10.89.0.23
      - KAMAILIO_PORT=5060
      - SMPP_HOST=10.89.0.49
      - SMPP_PORT=2775
      - SIP_BIND=0.0.0.0
      - SIP_PORT=5090
      - METRICS_PORT=9100
      - POLL_INTERVAL=3
      - REGISTER_REFRESH=60   # 2G-AoR usrloc refresh (60s bounds the silent 5G->2G window)
    depends_on:
      - kamailio
      - osmo-hlr
      - osmo-smsc
    networks:
      mvno_net:
        ipv4_address: 10.89.0.53
    restart: unless-stopped
    # Functional healthcheck: /health reflects the LIVE 2G-AoR registration
    # state (ip_sm_gw.py tracks the last successful REGISTER per AoR). The
    # bridge's own 30s retry loop self-heals, and the watchdog restarts the
    # bridge if registrations are lost — this check makes that state visible
    # instead of "Up but 5G->2G dead" (Issue 8.38 family).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ─── Spring Boot Interception Gateway & Vosk ASR JNI Runtime ───
  telecom-api:
    image: mvno-telecom-api:1.0.0
    container_name: mvno-api
    ports:
      - "8080:8080"
    volumes:
      - ./state/kamailio:/etc/kamailio:z
      - ./state/spool:/var/spool/rtpengine:z
      - ./vendor/vosk/vosk-model-small-en-us-0.15:/opt/vosk-model-small-en-us-0.15:ro,z
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      mvno_net:
        ipv4_address: 10.89.0.46 # static pin required: unpinned services get auto-allocated IPs that collide with pinned ones (IPAM conflict on network recreate)
    restart: unless-stopped

  # ─── AI Spam Filtration System (Mock API Endpoint) ───
  ai-filter:
    image: python:3.11-alpine
    container_name: mvno-ai-filter
    ports:
      - "8008:8000"
    healthcheck:
      # 127.0.0.1 explicit: busybox wget resolves localhost -> ::1 (IPv6) first,
      # and the mock binds IPv4 0.0.0.0 only (connection refused, no fallback).
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - python3
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        import json
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                if self.headers.get('Transfer-Encoding', '').lower() == 'chunked':
                    body = b''
                    while True:
                        line = self.rfile.readline().strip()
                        if not line:
                            break
                        size = int(line, 16)
                        if size == 0:
                            self.rfile.readline()
                            break
                        body += self.rfile.read(size)
                        self.rfile.readline()
                else:
                    length = int(self.headers.get('Content-Length', 0))
                    body = self.rfile.read(length) if length > 0 else b''
                text = body.decode('utf-8', errors='ignore')
                if 'E2E-BLOCK' in text:
                    resp = b'{"allow":false,"reason":"Spam (E2E deterministic block)"}'
                else:
                    # Deterministic demo rules. The E2E-BLOCK marker above is authoritative
                    # for ALL event types (certified by the e2e gate AI-block cell). In
                    # addition, post-call TRANSCRIPT events are blocked on scam keywords
                    # so a real scam call recording (Vosk ASR -> mock) is blocked end-to-end
                    # and mvno_vosk_blocked_total increments. SMS/VOICE_CALL are unaffected.
                    # Words are matched on word boundaries and verified to survive Vosk
                    # small-model ASR (e.g. "You have won a prize, call us now" -> Vosk:
                    # "you have won an prize called us out"). Demo scam script:
                    #   "You have won a prize, call us now"
                    allow = True
                    reason = "Clean content"
                    try:
                        import re
                        payload = json.loads(text)
                        if payload.get("event_type") == "TRANSCRIPT":
                            t = (payload.get("transcript") or "").lower()
                            words = ["won", "prize", "claim", "free", "urgent", "account", "blocked", "confirm"]
                            if any(re.search(r"\b" + w + r"\b", t) for w in words):
                                allow = False
                                reason = "Spam (phishing phrase detected)"
                    except Exception:
                        pass
                    resp = json.dumps({"allow": allow, "reason": reason}).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(resp)
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
        HTTPServer(('0.0.0.0', 8000), H).serve_forever()
    networks:
      mvno_net:
        ipv4_address: 10.89.0.44
    restart: unless-stopped

  # ─── Vector Log Shipper ───
  vector:
    image: timberio/vector:0.44.0-alpine
    container_name: mvno-vector
    # Runtime-agnostic container socket: defaults to the rootless Podman socket
    # (set by up.sh via PODMAN_USER_UID). Docker users override with, e.g.:
    #   DOCKER_SOCK=/var/run/docker.sock podman compose up -d
    # or add `DOCKER_SOCK=/var/run/docker.sock` to a top-level .env file.
    environment:
      VECTOR_LOG: error
    # Explicit --config: the vector image ships /etc/vector/vector.yaml
    # (demo_logs syslog generator + pretty console sink). Vector's default
    # config search finds vector.yaml FIRST, so without this argument the
    # real pipeline below was never loaded.
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./configs/vector/vector.toml:/etc/vector/vector.toml:z
      - ./state/logs/vector:/var/log/vector:z
      - ${DOCKER_SOCK:-/run/user/${PODMAN_USER_UID:-1000}/podman/podman.sock}:/var/run/docker.sock:ro,z
    depends_on:
      victorialogs:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.40
    restart: unless-stopped

  # ─── VictoriaMetrics Time-Series Database ───
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.147.0
    container_name: mvno-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./state/vm-data:/victoria-metrics-data:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.41
    restart: unless-stopped

  # ─── VictoriaLogs Log Database (ROADMAP item 3: persistent log sink) ───
  victorialogs:
    # v1.52.0 pinned (2026-07-16 build, digest 8f2140dc...) per repo image-pinning
    # convention (cb949e4: align VictoriaMetrics image pins) — :latest is drift.
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: mvno-victorialogs
    ports:
      - "9428:9428"
    # -retentionPeriod=7d: lightweight footprint (logs are operational evidence,
    # not archive). Distroless image (no shell/tools) — healthcheck fallback:
    # vector depends_on service_started (see ROADMAP item 4 documented fallback).
    command: ["-retentionPeriod=7d"]
    volumes:
      - ./state/victorialogs:/victoria-logs-data:z
    networks:
      mvno_net:
        ipv4_address: 10.89.0.57
    restart: unless-stopped

  # ─── VictoriaMetrics Telemetry Scraper (vmagent) ───
  vmagent:
    image: victoriametrics/vmagent:v1.147.0
    container_name: mvno-vmagent
    ports:
      - "8429:8429"
    command:
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - ./configs/victoria-metrics/scrape.yml:/etc/prometheus/prometheus.yml:z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.42
    restart: unless-stopped

  # ─── Grafana Real-Time Telecom NOC Dashboard ───
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: mvno-grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:z
      - ./state/grafana:/var/lib/grafana:U
      # Official VictoriaLogs datasource plugin (v0.31.0), vendored offline by
      # bootstrap.sh into vendor/grafana-plugins — GF_INSTALL_PLUGINS would need
      # grafana.com network at boot and is intentionally NOT used.
      - ./vendor/grafana-plugins/victoriametrics-logs-datasource:/var/lib/grafana/plugins/victoriametrics-logs-datasource:ro,z
    depends_on:
      victoria-metrics:
        condition: service_started
    networks:
      mvno_net:
        ipv4_address: 10.89.0.43
    restart: unless-stopped
