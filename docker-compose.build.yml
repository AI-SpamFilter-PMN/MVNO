# Build override — adds build: stanzas for online/source compilation.
# Default (docker-compose.yml) uses pre-loaded images for offline-first operation.
# Use this file when you want to build images from source:
#   podman compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  kamailio:
    build:
      context: .
      dockerfile: configs/kamailio/Dockerfile

  osmo-smsc:
    build:
      context: ./configs/osmocom

  telecom-api:
    build:
      context: ./telecom-api
      dockerfile: Dockerfile

  open5gs-webui:
    build:
      context: .
      dockerfile: configs/open5gs/Dockerfile.webui

  nrf:
    build:
      context: ./configs/open5gs
      dockerfile: Dockerfile
    image: mvno-open5gs:2.8.0

  ueransim-gnb:
    build:
      context: ./configs/ueransim
      dockerfile: Dockerfile
    image: mvno-ueransim:3.2.6

  2g-core:
    build:
      context: ./configs/2g
      dockerfile: Dockerfile.core
    image: mvno-2g-core:1.0.0

  2g-ms:
    build:
      context: ./configs/2g
      dockerfile: Dockerfile.ms
    image: mvno-2g-ms:1.0.0

  asterisk:
    build:
      context: ./configs/asterisk
      dockerfile: Dockerfile
    image: mvno-asterisk:1.0.0

